name: Update Macro Data

on:
  schedule:
    # ทุก 6 ชั่วโมง (UTC) — 00:00, 06:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch:   # ให้กดรันเองได้จากหน้า Actions

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/fetch_and_push.R') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install R packages
        run: |
          install.packages(c(
            "tidyquant", "fredr", "tidyverse",
            "jsonlite", "httr2", "jose"
          ), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Fetch data and push to Firestore
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY:   ${{ secrets.GCP_SA_KEY }}
        run: Rscript fetch_and_push.R
