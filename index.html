<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme variables ── */
:root {
  --bg:#0f0f0f; --bg2:#181818; --bg3:#222; --bg4:#2a2a2a;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16);
  --text:#e8e8e8; --text2:#888; --text3:#555;
  --up:#22c97a; --dn:#f05252;
  --blue:#4d9fff; --red:#f05252; --amber:#f5a623; --green:#22c97a; --purple:#a78bfa;
  --fs: 1rem;
}
[data-theme="light"] {
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ebebeb; --bg4:#e0e0e0;
  --border:rgba(0,0,0,0.10); --border2:rgba(0,0,0,0.18);
  --text:#111111; --text2:#555; --text3:#999;
  --up:#16a35a; --dn:#d63030;
  --blue:#1a73e8; --red:#d63030; --amber:#d97706; --green:#16a35a; --purple:#7c3aed;
}

body { background:var(--bg); color:var(--text); font-family:'SF Mono','JetBrains Mono','Fira Code',monospace; font-size:var(--fs); line-height:1.4; transition: background 0.2s, color 0.2s; }

/* ── Topbar ── */
#topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; gap:8px; flex-wrap:wrap; }
.brand { font-size:0.9em; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; }
.patch { font-size:0.65em; font-weight:400; color:var(--text3); margin-left:6px; }
.topbar-right { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.sdot { width:7px; height:7px; border-radius:50%; background:var(--text3); display:inline-block; }
.sdot.ok{background:var(--up)} .sdot.err{background:var(--dn)} .sdot.load{background:var(--amber)}
#stxt { font-size:0.75em; color:var(--text3); white-space:nowrap; }
.btn { background:none; border:1px solid var(--border2); color:var(--text2); padding:3px 9px; border-radius:3px; cursor:pointer; font-size:0.8em; font-family:inherit; white-space:nowrap; }
.btn:hover { border-color:var(--text2); color:var(--text); }
.btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700; }
.btn-primary:hover { opacity:0.85; color:#fff; }

.ctrl-group { display:flex; align-items:center; gap:4px; }
.ctrl-label { font-size:0.7em; color:var(--text3); }
.seg { display:flex; border:1px solid var(--border2); border-radius:3px; overflow:hidden; }
.seg button { background:none; border:none; border-right:1px solid var(--border2); color:var(--text2); padding:3px 8px; cursor:pointer; font-size:0.75em; font-family:inherit; }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--bg3); color:var(--text); }
.seg button:hover { background:var(--bg3); }
input[type=range] { width:80px; accent-color:var(--blue); }

/* ── Nav ── */
#nav { display:flex; padding:0 16px; border-bottom:1px solid var(--border); align-items:center; gap:0; overflow-x:auto; }
.nb { padding:8px 14px; font-size:0.8em; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; white-space:nowrap; }
.nb:hover{color:var(--text2)} .nb.active{color:var(--text);border-bottom-color:var(--blue)}
.nb-add { color:var(--text3); font-size:1.1em; padding:8px 10px; }
.nb-add:hover{color:var(--blue)}

/* ── Pages ── */
.page { display:none; padding:14px 16px; }
.page.active { display:block; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
.page-actions { display:flex; gap:5px; flex-wrap:wrap; }
.chart-grid { display:grid; gap:10px; }

/* ── Cards ── */
.card { border:1px solid var(--border); border-radius:4px; overflow:hidden; background:var(--bg2); }
.ch { padding:9px 11px 3px; display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
.ct { font-size:0.82em; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
.cs { font-size:0.72em; color:var(--text3); margin-top:2px; line-height:1.3; }
.ch-actions { display:flex; gap:2px; flex-shrink:0; }
.icon-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.82em; padding:2px 4px; font-family:inherit; }
.icon-btn:hover{color:var(--text)}
.cb { padding:2px 10px 10px; }
.tfs { display:flex; gap:1px; padding:1px 11px 5px; flex-wrap:wrap; }
.tf { font-size:0.72em; padding:1px 5px; border-radius:2px; color:var(--text3); cursor:pointer; background:none; border:none; font-family:inherit; }
.tf:hover{color:var(--text2)} .tf.on{background:var(--bg3);color:var(--text)}
.legend { display:flex; gap:10px; padding:1px 11px 7px; flex-wrap:wrap; }
.li { display:flex; align-items:center; gap:4px; font-size:0.72em; color:var(--text2); }
.ls { width:12px; height:2px; border-radius:1px; flex-shrink:0; }
.ld { font-size:0.78em; padding:22px; text-align:center; color:var(--text3); }
.er { color:var(--dn); font-size:0.75em; padding:3px 11px 8px; }
.empty { padding:36px; text-align:center; color:var(--text3); font-size:0.85em; }

/* ── News ── */
.news-grid { display:grid; gap:10px; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); }
.news-card { border:1px solid var(--border); border-radius:4px; background:var(--bg2); padding:14px; display:flex; flex-direction:column; gap:8px; }
.news-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.news-source { font-size:0.68em; color:var(--blue); text-transform:uppercase; letter-spacing:0.06em; }
.news-session { font-size:0.65em; color:var(--text3); }
.news-title { font-size:0.82em; font-weight:700; line-height:1.4; }
.news-summary { font-size:0.78em; color:var(--text2); line-height:1.6; }
.news-why { font-size:0.70em; color:var(--amber); border-left:2px solid var(--amber); padding-left:7px; }
.news-link { font-size:0.72em; color:var(--blue); text-decoration:none; margin-top:2px; }
.news-link:hover { text-decoration:underline; }
.news-date-header { font-size:0.75em; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin:14px 0 6px; border-bottom:1px solid var(--border); padding-bottom:4px; }
.news-empty { padding:36px; text-align:center; color:var(--text3); font-size:0.85em; }

/* ── Modal ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto; }
.modal-bg.show { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border2); border-radius:6px; width:100%; max-width:560px; padding:18px; }
.modal h3 { font-size:0.85em; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:0.72em; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
.field input[type=text], .field select { width:100%; background:var(--bg3); border:1px solid var(--border2); color:var(--text); padding:6px 9px; border-radius:3px; font-family:inherit; font-size:0.82em; }
.field input:focus, .field select:focus { outline:none; border-color:var(--blue); }

.series-header { display:grid; grid-template-columns:1fr 100px 90px 90px 26px; gap:5px; margin-bottom:4px; }
.series-header span { font-size:0.68em; color:var(--text3); text-transform:uppercase; letter-spacing:0.04em; }
.series-row { display:grid; grid-template-columns:1fr 100px 90px 90px 26px; gap:5px; margin-bottom:5px; align-items:center; }
.series-row select { background:var(--bg3); border:1px solid var(--border2); color:var(--text); padding:4px 6px; border-radius:3px; font-family:inherit; font-size:0.78em; width:100%; }
.rm-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.9em; padding:0 4px; }
.rm-btn:hover{color:var(--dn)}
.add-series-btn { font-size:0.78em; color:var(--blue); background:none; border:1px dashed var(--border2); border-radius:3px; padding:4px; width:100%; cursor:pointer; font-family:inherit; margin-top:3px; }
.add-series-btn:hover{border-color:var(--blue)}
.hint { font-size:0.68em; color:var(--text3); margin-top:3px; }
.modal-actions { display:flex; gap:7px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Macro<span class="patch">v3.6</span></div>
  <div class="topbar-right">
    <span class="sdot" id="sdot"></span>
    <span id="stxt">loading…</span>
    <div class="ctrl-group">
      <span class="ctrl-label">Theme</span>
      <div class="seg">
        <button id="th-dark" class="on" onclick="setTheme('dark')">Dark</button>
        <button id="th-light" onclick="setTheme('light')">Light</button>
      </div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Font</span>
      <input type="range" id="fs-range" min="100" max="200" step="10" value="100" oninput="setFont(this.value)">
      <span class="ctrl-label" id="fs-label">100%</span>
    </div>
    <button class="btn" onclick="exportConfig()">Export</button>
    <button class="btn" onclick="importConfig()">Import</button>
    <button class="btn" onclick="loadData()">↻</button>
  </div>
</div>

<div id="nav"></div>
<div id="pages"></div>

<!-- Chart Modal -->
<div class="modal-bg" id="chart-modal">
  <div class="modal">
    <h3 id="chart-modal-title">Add Chart</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="cm-title" placeholder="เช่น Crude Oil vs Gold">
    </div>
    <div class="field">
      <label>Series (1–8)</label>
      <div class="series-header">
        <span>Series</span><span>Axis</span><span>Function</span><span>Color</span><span></span>
      </div>
      <div id="cm-series"></div>
      <button class="add-series-btn" id="cm-add-btn" onclick="addSeriesRow()">+ add series</button>
      <div class="hint">Function apply ได้แยกกันต่อ series · L/R = แกนซ้าย/ขวา</div>
    </div>
    <div class="field">
      <label>Default period</label>
      <select id="cm-period">
        <option value="3m">3M</option>
        <option value="6m">6M</option>
        <option value="1y" selected>1Y</option>
        <option value="3y">3Y</option>
        <option value="10y">10Y</option>
        <option value="max">Max</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeChartModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveChart()">Save</button>
    </div>
  </div>
</div>

<!-- Page Modal -->
<div class="modal-bg" id="page-modal">
  <div class="modal" style="max-width:360px">
    <h3 id="page-modal-title">Add Page</h3>
    <div class="field">
      <label>Page name</label>
      <input type="text" id="pm-name" placeholder="เช่น US Macro">
    </div>
    <div class="field">
      <label>Columns (1–8)</label>
      <select id="pm-cols">
        <option value="0">Auto</option>
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closePageModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePage()">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCggg5oZZl2dUNrncisVlJuugsT2XUtls8",
  authDomain: "macroindicator-6b265.firebaseapp.com",
  projectId: "macroindicator-6b265",
  storageBucket: "macroindicator-6b265.firebasestorage.app",
  messagingSenderId: "871039169298",
  appId: "1:871039169298:web:50f0f04ad17f1123a3b9cb"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ════════════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════════════
const COLORS = ['#4d9fff','#f05252','#f5a623','#22c97a','#a78bfa','#888888','#f0a500','#00c9a7'];
const FN_OPTS = ['raw','norm','cumret','yoy','mom','ma20','ma50'];
const FN_LABEL = { raw:'raw', norm:'base 100', cumret:'cum%', yoy:'YoY%', mom:'MoM%', ma20:'MA20', ma50:'MA50' };
const PERIOD_MONTHS = { '3m':3,'6m':6,'1y':12,'3y':36,'10y':120,'max':9999 };
const NEWS_PAGE_ID = '__news__';

const SERIES_GROUPS = {
  'US Equity':    ['SPX','NASDAQ','VIX'],
  'Mag 7':        ['AAPL','MSFT','GOOGL','AMZN','NVDA','META','TSLA'],
  'Crypto':       ['BTC'],
  'EU Indices':   ['STOXX50','DAX','FTSE'],
  'Asia Indices': ['SET','NIKKEI','HSI','KOSPI','NIFTY','IDX'],
  'SET Industry': ['SET_AGRO','SET_CONSUMP','SET_FINCIAL','SET_INDUS','SET_PROPCON','SET_RESOURC','SET_SERVICE','SET_TECH'],
  'SET Sector':   ['SET_BANK','SET_ENERG','SET_FOOD','SET_HELTH','SET_ICT','SET_INSUR','SET_PETRO','SET_PROP','SET_TRANS','SET_TOURISM','SET_COMM','SET_CONMAT','SET_STEEL','SET_FIN','SET_AGRI'],
  'FX':           ['USDTHB','USDJPY','USDKRW','USDINR','USDIDR','EURUSD'],
  'Commodities':  ['WTI','BRENT','GOLD','SILVER','COPPER','NATGAS'],
  'US Macro':     ['FEDFUNDS','CPI','CORECPI','DGS2','DGS10','UNRATE'],
  'EU Macro':     ['ECBRATE','EUCPI'],
  'PTT OR Oil':   ['PTTOR_PREMIUM_DIESEL','PTTOR_SUPER_POWER_GSH95','PTTOR_GASOHOL_91','PTTOR_GASOHOL_E20','PTTOR_GASOHOL_E85','PTTOR_BENZENE_95'],
};

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
const SERIES = {};
const charts = {};
let NEWS = [];  // [{date, session, news:[...]}]
let config = loadConfig();
let activePageId = config.pages[0]?.id || null;
let editingChart = null;

// ── theme & font ──────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('th-dark').classList.toggle('on', t==='dark');
  document.getElementById('th-light').classList.toggle('on', t==='light');
  localStorage.setItem('macro:theme', t);
  Object.values(charts).forEach(c => c.update());
}
window.setTheme = setTheme;

function setFont(pct) {
  document.documentElement.style.setProperty('--fs', (pct/100)+'rem');
  document.getElementById('fs-label').textContent = pct+'%';
  localStorage.setItem('macro:font', pct);
}
window.setFont = setFont;

const savedTheme = localStorage.getItem('macro:theme') || 'dark';
const savedFont  = parseInt(localStorage.getItem('macro:font') || '100');
setTheme(savedTheme);
document.getElementById('fs-range').value = savedFont;
setFont(savedFont);

// ── config ────────────────────────────────────────
function defaultConfig() {
  return {
    pages: [
      { id:uid(), name:'US', cols:2, charts:[
        { id:uid(), title:'S&P 500', series:[{id:'SPX',axis:'L',fn:'raw',color:'#4d9fff'}], period:'1y' },
        { id:uid(), title:'Fed Rate vs CPI', series:[{id:'FEDFUNDS',axis:'L',fn:'raw',color:'#4d9fff'},{id:'CPI',axis:'L',fn:'yoy',color:'#f05252'}], period:'3y' },
        { id:uid(), title:'Yield Curve 2Y-10Y', series:[{id:'DGS2',axis:'L',fn:'raw',color:'#4d9fff'},{id:'DGS10',axis:'L',fn:'raw',color:'#f05252'}], period:'5y' },
        { id:uid(), title:'Unemployment', series:[{id:'UNRATE',axis:'L',fn:'raw',color:'#888888'}], period:'3y' },
      ]},
      { id:uid(), name:'Mag 7', cols:2, charts:[
        { id:uid(), title:'Mag7 normalized', series:[
          {id:'AAPL',axis:'L',fn:'norm',color:'#4d9fff'},
          {id:'NVDA',axis:'L',fn:'norm',color:'#f05252'},
          {id:'MSFT',axis:'L',fn:'norm',color:'#f5a623'},
          {id:'GOOGL',axis:'L',fn:'norm',color:'#22c97a'},
          {id:'META',axis:'L',fn:'norm',color:'#a78bfa'},
        ], period:'1y' },
        { id:uid(), title:'Bitcoin', series:[{id:'BTC',axis:'L',fn:'raw',color:'#f5a623'}], period:'1y' },
      ]},
    ]
  };
}

function loadConfig() {
  try {
    const raw = localStorage.getItem('macro:config');
    if (raw) {
      const cfg = JSON.parse(raw);
      cfg.pages?.forEach(p => p.charts?.forEach(c => {
        if (c.fn && c.series) {
          c.series.forEach(s => { if (!s.fn) s.fn = c.fn; });
          delete c.fn;
        }
      }));
      return cfg;
    }
  } catch {}
  return defaultConfig();
}
function saveConfig() { localStorage.setItem('macro:config', JSON.stringify(config)); }
function uid() { return Math.random().toString(36).slice(2,9); }

// ════════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════════
async function fetchAll() {
  const snap = await getDocs(collection(db, 'series'));
  snap.forEach(doc => {
    const d = doc.data();
    SERIES[doc.id] = {
      name: d.name || doc.id,
      updated: d.updated || '',
      data: (d.data||[]).map(p=>({x:p.d, y:p.v})).sort((a,b)=>a.x<b.x?-1:1)
    };
  });
}

async function fetchNews() {
  NEWS = [];
  const snap = await getDocs(collection(db, 'daily_news'));
  snap.forEach(d => {
    const data = d.data();
    const newsItems = (data.news || []).map(n => ({
      title:      n.title      || '',
      summary_th: n.summary_th || '',
      source:     n.source     || '',
      url:        n.url        || '',
      why_picked: n.why_picked || ''
    }));
    if (newsItems.length) {
      NEWS.push({
        docId:   d.id,
        date:    data.date    || d.id.slice(0,10),
        session: data.session || '',
        news:    newsItems
      });
    }
  });
  // เรียงจากใหม่ไปเก่า
  NEWS.sort((a,b) => b.docId.localeCompare(a.docId));
}

window.loadData = async function() {
  setStatus('load','loading…');
  try {
    await Promise.all([fetchAll(), fetchNews()]);
    window._SERIES = SERIES;
    render();
    const upd = Object.values(SERIES)[0]?.updated || '';
    setStatus('ok', upd ? 'data: '+upd.slice(0,16).replace('T',' ')+' UTC' : 'loaded');
  } catch(e) { setStatus('err','Firestore error'); console.error(e); }
};

function setStatus(s,t) {
  document.getElementById('sdot').className='sdot '+s;
  document.getElementById('stxt').textContent=t;
}

// ════════════════════════════════════════════════════
//  TRANSFORMS
// ════════════════════════════════════════════════════
function cutByPeriod(data, period) {
  if (period==='max'||!data.length) return data;
  const months = PERIOD_MONTHS[period]??12;
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth()-months);
  const cs = cutoff.toISOString().slice(0,10);
  return data.filter(p=>p.x>=cs);
}

function applyFn(data, fn) {
  if (!data.length) return data;
  switch(fn) {
    case 'raw':    return data;
    case 'norm':   { const b=data[0].y; return data.map(d=>({x:d.x,y:+(d.y/b*100).toFixed(2)})); }
    case 'cumret': { const b=data[0].y; return data.map(d=>({x:d.x,y:+((d.y/b-1)*100).toFixed(2)})); }
    case 'yoy':    return lookbackPct(data,365);
    case 'mom':    return lookbackPct(data,30);
    case 'ma20':   return movAvg(data,20);
    case 'ma50':   return movAvg(data,50);
    default:       return data;
  }
}

function lookbackPct(data, days) {
  const out=[];
  for (let i=0;i<data.length;i++) {
    const tgt = new Date(new Date(data[i].x)-days*86400000).toISOString().slice(0,10);
    let ref=null;
    for (let j=i-1;j>=0;j--) { if(data[j].x<=tgt){ref=data[j];break;} }
    if (ref&&ref.y!==0) out.push({x:data[i].x, y:+((data[i].y/ref.y-1)*100).toFixed(2)});
  }
  return out;
}

function movAvg(data,n) {
  const out=[];
  for (let i=n-1;i<data.length;i++) {
    let s=0; for(let j=i-n+1;j<=i;j++) s+=data[j].y;
    out.push({x:data[i].x, y:+(s/n).toFixed(2)});
  }
  return out;
}

// ════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════
function render() { renderNav(); renderActivePage(); }

function renderNav() {
  const nav=document.getElementById('nav');
  nav.innerHTML='';

  // news tab (fixed, always first)
  const newsBtn=document.createElement('button');
  newsBtn.className='nb'+(activePageId===NEWS_PAGE_ID?' active':'');
  newsBtn.textContent='News';
  newsBtn.onclick=()=>{ activePageId=NEWS_PAGE_ID; render(); };
  nav.appendChild(newsBtn);

  config.pages.forEach(page=>{
    const btn=document.createElement('button');
    btn.className='nb'+(page.id===activePageId?' active':'');
    btn.textContent=page.name;
    btn.onclick=()=>{ activePageId=page.id; render(); };
    nav.appendChild(btn);
  });
  const add=document.createElement('button');
  add.className='nb nb-add'; add.textContent='+'; add.title='Add page';
  add.onclick=openPageModal;
  nav.appendChild(add);
}

function renderActivePage() {
  const container=document.getElementById('pages');
  container.innerHTML='';
  Object.values(charts).forEach(c=>c.destroy());

  if (activePageId === NEWS_PAGE_ID) {
    renderNewsPage(container);
    return;
  }

  const page=config.pages.find(p=>p.id===activePageId);
  if (!page) { container.innerHTML='<div class="empty">ยังไม่มี page — กด + ใน nav</div>'; return; }

  const el=document.createElement('div');
  el.className='page active';

  const head=document.createElement('div');
  head.className='page-head';
  const curGlobal = page.globalPeriod || '';
  head.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:0.78em;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em">${page.name}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-size:0.7em;color:var(--text3)">All:</span>
        <div class="seg" id="gp-${page.id}">
          ${['3m','6m','1y','3y','10y','max'].map(p=>`<button onclick="setGlobalPeriod('${page.id}','${p}',this)" class="${curGlobal===p?'on':''}">${p.toUpperCase()}</button>`).join('')}
          <button onclick="setGlobalPeriod('${page.id}','',this)" class="${!curGlobal?'on':''}">Per chart</button>
        </div>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="openChartModal('${page.id}')">+ Chart</button>
      <button class="btn" onclick="editPage('${page.id}')">Edit page</button>
      <button class="btn" onclick="deletePage('${page.id}')">Delete</button>
    </div>`;
  el.appendChild(head);

  if (!page.charts.length) {
    el.innerHTML+='<div class="empty">ยังไม่มี chart<br><button class="btn btn-primary" style="margin-top:10px" onclick="openChartModal(\''+page.id+'\')">+ Add Chart</button></div>';
  } else {
    const grid=document.createElement('div');
    grid.className='chart-grid';
    const cols=page.cols||0;
    grid.style.gridTemplateColumns = cols>0 ? `repeat(${cols},1fr)` : 'repeat(auto-fill,minmax(360px,1fr))';
    page.charts.forEach(chart=>grid.appendChild(makeCard(page,chart)));
    el.appendChild(grid);
  }

  container.appendChild(el);
  page.charts.forEach(chart=>drawChart(page,chart));
}

// ── News Page ─────────────────────────────────────
function renderNewsPage(container) {
  const el = document.createElement('div');
  el.className = 'page active';

  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `<span style="font-size:0.78em;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em">News · AI Curated</span>`;
  el.appendChild(head);

  if (!NEWS.length) {
    el.innerHTML += '<div class="news-empty">ยังไม่มีข่าว — pipeline ยังไม่ run หรือ Firestore ว่าง</div>';
    container.appendChild(el);
    return;
  }

  NEWS.forEach(batch => {
    const dateLabel = document.createElement('div');
    dateLabel.className = 'news-date-header';
    const sessionLabel = batch.session === 'morning' ? '🌅 เช้า' : batch.session === 'afternoon' ? '🌇 บ่าย' : '';
    dateLabel.textContent = `${batch.date}  ${sessionLabel}`;
    el.appendChild(dateLabel);

    const grid = document.createElement('div');
    grid.className = 'news-grid';

    batch.news.forEach(item => {
      const card = document.createElement('div');
      card.className = 'news-card';
      card.innerHTML = `
        <div class="news-meta">
          <span class="news-source">${item.source}</span>
        </div>
        <div class="news-title">${item.title}</div>
        <div class="news-summary">${item.summary_th}</div>
        ${item.why_picked ? `<div class="news-why">${item.why_picked}</div>` : ''}
        <a class="news-link" href="${item.url}" target="_blank" rel="noopener">อ่านข่าวเต็ม →</a>
      `;
      grid.appendChild(card);
    });

    el.appendChild(grid);
  });

  container.appendChild(el);
}

// ════════════════════════════════════════════════════
//  CHART MODAL
// ════════════════════════════════════════════════════
window.openChartModal = function(pageId, chartId) {
  editingChart={pageId, chartId:chartId||null};
  document.getElementById('chart-modal-title').textContent=chartId?'Edit Chart':'Add Chart';
  let chart=null;
  if (chartId) {
    const page=config.pages.find(p=>p.id===pageId);
    chart=page.charts.find(c=>c.id===chartId);
  }
  document.getElementById('cm-title').value=chart?.title||'';
  document.getElementById('cm-period').value=chart?.period||'1y';
  const wrap=document.getElementById('cm-series');
  wrap.innerHTML='';
  const sList=chart?.series||[{id:Object.keys(SERIES)[0]||'SPX',axis:'L',fn:'raw',color:COLORS[0]}];
  sList.forEach((s,i)=>wrap.appendChild(makeSeriesRow(s,i)));
  updateAddBtn();
  document.getElementById('chart-modal').classList.add('show');
};

function makeSeriesRow(s,idx) {
  const row=document.createElement('div');
  row.className='series-row';
  const sel=document.createElement('select');
  const grouped=new Set();
  Object.entries(SERIES_GROUPS).forEach(([grp,ids])=>{
    const og=document.createElement('optgroup');
    og.label=grp;
    ids.forEach(id=>{
      if (!SERIES[id]) return;
      grouped.add(id);
      const opt=document.createElement('option');
      opt.value=id; opt.textContent=SERIES[id].name;
      if (id===s.id) opt.selected=true;
      og.appendChild(opt);
    });
    if (og.children.length) sel.appendChild(og);
  });
  const other=document.createElement('optgroup'); other.label='Other';
  Object.keys(SERIES).sort().forEach(id=>{
    if (grouped.has(id)) return;
    const opt=document.createElement('option');
    opt.value=id; opt.textContent=SERIES[id].name;
    if (id===s.id) opt.selected=true;
    other.appendChild(opt);
  });
  if (other.children.length) sel.appendChild(other);
  const axis=document.createElement('select');
  ['L','R'].forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent='Axis '+a; if(a===s.axis)o.selected=true; axis.appendChild(o); });
  const fn=document.createElement('select');
  FN_OPTS.forEach(f=>{ const o=document.createElement('option'); o.value=f; o.textContent=FN_LABEL[f]; if(f===(s.fn||'raw'))o.selected=true; fn.appendChild(o); });
  const colorSel=document.createElement('select');
  ['blue','red','amber','green','purple','gray','orange','teal'].forEach((n,i)=>{
    const o=document.createElement('option'); o.value=COLORS[i]; o.textContent=n;
    if(COLORS[i]===s.color)o.selected=true; colorSel.appendChild(o);
  });
  const rm=document.createElement('button');
  rm.className='rm-btn'; rm.textContent='✕';
  rm.onclick=()=>{ row.remove(); updateAddBtn(); };
  row.appendChild(sel); row.appendChild(axis); row.appendChild(fn); row.appendChild(colorSel); row.appendChild(rm);
  return row;
}

window.addSeriesRow = function() {
  const wrap=document.getElementById('cm-series');
  if (wrap.children.length>=8) return;
  const n=wrap.children.length;
  wrap.appendChild(makeSeriesRow({id:Object.keys(SERIES)[0]||'SPX',axis:'L',fn:'raw',color:COLORS[n%COLORS.length]},n));
  updateAddBtn();
};

function updateAddBtn() {
  const n=document.getElementById('cm-series').children.length;
  document.getElementById('cm-add-btn').style.display=n>=8?'none':'block';
}

window.saveChart = function() {
  const title=document.getElementById('cm-title').value.trim()||'Chart';
  const period=document.getElementById('cm-period').value;
  const series=[...document.getElementById('cm-series').children].map(row=>{
    const sels=row.querySelectorAll('select');
    return {id:sels[0].value, axis:sels[1].value, fn:sels[2].value, color:sels[3].value};
  });
  if (!series.length) return;
  const page=config.pages.find(p=>p.id===editingChart.pageId);
  if (editingChart.chartId) {
    const chart=page.charts.find(c=>c.id===editingChart.chartId);
    Object.assign(chart,{title,period,series});
  } else {
    page.charts.push({id:uid(),title,period,series});
  }
  saveConfig(); closeChartModal(); render();
};

window.closeChartModal=()=>document.getElementById('chart-modal').classList.remove('show');

window.deleteChart=function(pageId,chartId){
  if (!confirm('ลบ chart นี้?')) return;
  const page=config.pages.find(p=>p.id===pageId);
  page.charts=page.charts.filter(c=>c.id!==chartId);
  saveConfig(); render();
};

// ════════════════════════════════════════════════════
//  PAGE MODAL
// ════════════════════════════════════════════════════
let editingPageId=null;

window.openPageModal=function(){
  editingPageId=null;
  document.getElementById('page-modal-title').textContent='Add Page';
  document.getElementById('pm-name').value='';
  document.getElementById('pm-cols').value='2';
  document.getElementById('page-modal').classList.add('show');
};

window.editPage=function(pageId){
  editingPageId=pageId;
  const page=config.pages.find(p=>p.id===pageId);
  document.getElementById('page-modal-title').textContent='Edit Page';
  document.getElementById('pm-name').value=page.name;
  document.getElementById('pm-cols').value=String(page.cols||0);
  document.getElementById('page-modal').classList.add('show');
};

window.savePage=function(){
  const name=document.getElementById('pm-name').value.trim()||'Page';
  const cols=parseInt(document.getElementById('pm-cols').value);
  if (editingPageId) {
    const page=config.pages.find(p=>p.id===editingPageId);
    page.name=name; page.cols=cols;
  } else {
    const np={id:uid(),name,cols,charts:[]};
    config.pages.push(np);
    activePageId=np.id;
  }
  saveConfig(); closePageModal(); render();
};

window.closePageModal=()=>document.getElementById('page-modal').classList.remove('show');

window.deletePage=function(pageId){
  if (!confirm('ลบ page ทั้งหมด?')) return;
  config.pages=config.pages.filter(p=>p.id!==pageId);
  if (activePageId===pageId) activePageId=config.pages[0]?.id||null;
  saveConfig(); render();
};

// ════════════════════════════════════════════════════
//  CHART DRAW
// ════════════════════════════════════════════════════
function makeCard(page,chart) {
  const seriesDesc = chart.series.map(s=>`${SERIES[s.id]?.name||s.id}(${FN_LABEL[s.fn]||s.fn})`).join(' · ');
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="ch">
      <div><div class="ct">${chart.title}</div><div class="cs">${seriesDesc}</div></div>
      <div class="ch-actions">
        <button class="icon-btn" title="Edit" onclick="openChartModal('${page.id}','${chart.id}')">✎</button>
        <button class="icon-btn" title="Delete" onclick="deleteChart('${page.id}','${chart.id}')">✕</button>
      </div>
    </div>
    <div class="tfs" id="tfs-${chart.id}"></div>
    <div class="cb"><div style="position:relative;height:180px">
      <div class="ld" id="ld-${chart.id}">loading…</div>
      <canvas id="cv-${chart.id}" style="display:none"></canvas>
    </div></div>
    <div class="legend" id="lg-${chart.id}"></div>
    <div class="er" id="er-${chart.id}"></div>`;

  setTimeout(()=>{
    const tfs=card.querySelector('#tfs-'+chart.id);
    ['3m','6m','1y','3y','10y','max'].forEach(p=>{
      const b=document.createElement('button');
      b.className='tf'+(p===chart.period?' on':'');
      b.textContent=p.toUpperCase();
      b.onclick=()=>{
        const pg = config.pages.find(x=>x.id===page.id);
        if (pg) { pg.globalPeriod=''; saveConfig(); }
        const gp = document.getElementById('gp-'+page.id);
        if (gp) {
          gp.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
          const perChart = [...gp.querySelectorAll('button')].find(x=>x.textContent==='Per chart');
          if (perChart) perChart.classList.add('on');
        }
        chart.period=p; saveConfig();
        tfs.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        drawChart(page,chart);
      };
      tfs.appendChild(b);
    });
  },0);
  return card;
}

function drawChart(page,chart) {
  const canvas=document.getElementById('cv-'+chart.id);
  const ld=document.getElementById('ld-'+chart.id);
  const er=document.getElementById('er-'+chart.id);
  const lg=document.getElementById('lg-'+chart.id);
  if (!canvas) return;
  if (er) er.textContent='';
  if (lg) lg.innerHTML='';

  let commonLabels=null;
  const datasets=[];
  let hasRight=false;

  chart.series.forEach(s=>{
    const src=SERIES[s.id];
    if (!src) return;
    let pts=cutByPeriod(src.data, chart.period);
    pts=applyFn(pts, s.fn||'raw');
    if (!pts.length) return;
    if (!commonLabels) commonLabels=pts.map(p=>p.x);
    const map=Object.fromEntries(pts.map(p=>[p.x,p.y]));
    const values=commonLabels.map(l=>map[l]??null);
    datasets.push({
      label:src.name, data:values, borderColor:s.color,
      borderWidth:1.8, pointRadius:0, pointHoverRadius:3,
      tension:0.3, fill:false, spanGaps:true,
      yAxisID:s.axis==='R'?'yR':'yL'
    });
    if (s.axis==='R') hasRight=true;
    if (lg) {
      const li=document.createElement('div');
      li.className='li';
      li.innerHTML=`<span class="ls" style="background:${s.color}"></span>${src.name} <span style="color:var(--text3);margin-left:2px">${FN_LABEL[s.fn]||s.fn} ${s.axis}</span>`;
      lg.appendChild(li);
    }
  });

  if (ld) ld.style.display='none';
  canvas.style.display='block';
  if (!datasets.length||!commonLabels) { if(er) er.textContent='no data'; return; }
  if (charts[chart.id]) charts[chart.id].destroy();

  const gridColor='rgba(128,128,128,0.1)';
  const tickColor=getComputedStyle(document.documentElement).getPropertyValue('--text3').trim()||'#555';

  const scales={
    x:{ type:'category', labels:commonLabels, ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:7,maxRotation:0}, grid:{color:gridColor}, border:{color:gridColor} },
    yL:{ position:'left', ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5}, grid:{color:gridColor}, border:{color:gridColor} }
  };
  if (hasRight) scales.yR={ position:'right', ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5}, grid:{drawOnChartArea:false}, border:{color:gridColor} };

  charts[chart.id]=new Chart(canvas,{
    type:'line', data:{labels:commonLabels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'var(--bg)',borderColor:'var(--border2)',borderWidth:1,titleColor:'var(--text2)',bodyColor:'var(--text)',titleFont:{family:'monospace',size:11},bodyFont:{family:'monospace',size:12}}
      },
      scales
    }
  });
}

// ════════════════════════════════════════════════════
//  IMPORT / EXPORT
// ════════════════════════════════════════════════════
window.exportConfig=function(){
  const blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='macro-config.json'; a.click();
};

window.importConfig=function(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        config=JSON.parse(reader.result);
        activePageId=config.pages[0]?.id||null;
        saveConfig(); render();
      } catch(err){ alert('Import failed: '+err.message); }
    };
    reader.readAsText(e.target.files[0]);
  };
  inp.click();
};

document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.onclick=e=>{ if(e.target===bg) bg.classList.remove('show'); };
});

window.setGlobalPeriod = function(pageId, period, btn) {
  const page = config.pages.find(p => p.id === pageId);
  if (!page) return;
  page.globalPeriod = period;
  document.querySelectorAll(`#gp-${pageId} button`).forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  if (period) {
    page.charts.forEach(chart => {
      chart.period = period;
      const tfs = document.getElementById('tfs-' + chart.id);
      if (tfs) {
        tfs.querySelectorAll('.tf').forEach(b => {
          b.classList.toggle('on', b.textContent.toLowerCase() === period);
        });
      }
      drawChart(page, chart);
    });
  }
  saveConfig();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(loadData, 500));
} else {
  setTimeout(loadData, 500);
}
</script>
