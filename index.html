<!-- patch v6.6: Oil Fund Status chart x-axis: label format drops the space ("Jan25" not "Jan 25"); ticks + vertical gridlines now placed only at the first data point of each quarter (Q1/Q2/Q3/Q4) instead of Chart.js autoSkip picking arbitrary points -->
<!-- patch v6.5: "ข้อมูลล่าสุด" legend date now includes weekday abbreviation, e.g. "Mon 20-Jul-2026" (fmtDMon gets new withWeekday param; only this label uses it, card "ล่าสุด" labels unchanged) -->
<!-- patch v6.4: fix TH Energy price chart x-axis month labels being wrong when zoomed (min/max set) — tick callback used the 2nd arg (idx = position among currently-displayed ticks, re-counted from 0 after zoom) instead of the 1st arg (val = true index into the full-year labels array), so labels showed e.g. Jan-Aug instead of the actual visible Mar-Sep window; same fix applied to grid-line month-boundary highlighting and to the Oil Fund Status chart's autoSkip tick callback -->
<!-- patch v6.3: fix breakdown table ref-date column header using colspan="2" while body rows only render 1 <td> for that column — header text was straddling 2 column-widths (arrow col + ref col) so it didn't line up above the right-aligned numbers below it; removed the stray colspan -->
<!-- patch v6.2: breakdown table ref-date column + "vs {date}" KPI badge now show the ACTUAL date of the matched data point (via new pointAtDate helper) instead of the raw reference date — fixes header showing e.g. "24 Jun" while the price value shown actually came from an earlier fallback date (ref date had no data, e.g. holiday) -->
<!-- patch v6.1: TH Energy price charts (year-overlay) set tension:0 (was 0.3) — bezier curve smoothing on sparse weekly points plotted against a dense daily category axis was creating unnatural bulges/waves ("เบี้ยว"); DISCOUNT breakdown row label shortened to "ส่วนลดหน้าโรงกลั่น" -->
<!-- patch v6.0: DIESEL breakdown adds DISCOUNT row ("ส่วนลดจากราคาหน้าโรงกลั่น", history defaults to 0); breakdown table header dates drop year (D-Mon only); breakdown label column widened (table-layout:fixed, 42%) to stop long labels wrapping oddly; card header no longer shows the "กองทุน ±x.xx" badge (Oil Fund now lives in its own hero card) -->
<!-- patch v5.14: date format "D-Mon" (e.g. 8-Jul) for all card "ล่าสุด" fields, "D-Mon-YYYY" for the legend latest-date; shared legend now centered instead of left-indented -->
<!-- patch v5.13: fix shared legend "ปีนี้/ปีก่อน" not actually matching the +10%/bold styling (overridden by .li class font-size); indent legend to align with DIESEL card text -->
<!-- patch v5.12: Oil Fund Status "ล่าสุด" date shows MM-DD only; add latest oil price date next to shared legend, both legend + date bumped +10% font and bold -->
<!-- patch v5.11: Oil Fund Status chart colors segments red/pink when negative, green/light-green when positive; fix dark-theme card shadow being invisible (black-on-black) by adding a subtle light rim layer -->
<!-- patch v5.10: Export PDF now includes Oil Fund Status card alongside Diesel/Gasohol95; hero grid stays 3-column during export -->
<!-- patch v5.9.3: relabel first breakdown row to "ราคาหน้าโรงกลั่น" -->
<!-- patch v5.9.2: price breakdown adds Ex-Refinery as first row and Retail/Wholesale price as last row; revert card background to original (--bg2), drop the blue tint -->
<!-- patch v5.9.1: move card shadow from per-chart hero children to the hero container itself; drop blue hero border for a neutral one; more padding above/below chart canvas -->
<!-- patch v5.9: card visual refresh — more spacing between cards, subtle drop shadow, light-blue tinted background (theme-aware) -->
<!-- patch v5.8: price structure breakdown collapsed to 4 grouped components (Tax+Cons.Fund, Marketing Margin, VAT, Oil Fund); Diesel/Gasohol95 breakdown open by default and linked (collapsing one collapses both) -->
<!-- patch v5.7.2: fix TH Energy chart zoom range wrapping across year boundary (min>max) when latest month is near Jan or Dec — clamp to 1-12 instead of modulo wrap -->
<!-- patch v5.7.1: fix chart canvases overflowing/cut off at right edge on window resize — canvas max-width:100%, html overflow-x:hidden, resize listener recalculates chart.js canvas size -->
<!-- patch v5.7: Export PDF now limited to Diesel + Gasohol 95 with breakdown expanded, laid out 2-column A4 landscape -->
<!-- patch v5.6: 3M/6M x-axis skips month label if first data point of that month is after the 4th; 6M label format drops year, matches 3M "1-Jan" -->
<!-- patch v5.5.4: fix Cum%/norm base using full-history first point instead of period-start point (regression from v5.2c fix); EPPO metadata now covered via push_meta_only.R static catalog -->
<!-- patch v5.5.2: bugfix pass — restore accidental --bg3 color change; fix pdf-export chart height being silently overridden by inline style (missing !important) -->
<!-- patch v5.5.1: merge EPPO Diesel/Gasoline/Other into a single "EPPO" group in the series selector -->
<!-- patch v5.5: limit EPPO series selectable on general chart page to Retail/Wholesale + Oil Fund only; hide other breakdown fields -->
<!-- patch v5.4.1: reorder TH Energy product cards -->
<!-- patch v5.4: MTD/QTD now show avg level + %YoY vs same-period-last-year average -->
<!-- patch v5.3: remove print feature, add "Export PDF" button on TH Energy page (client-side via html2canvas + jsPDF) -->
<!-- patch v5.2c: fix MA/YoY/MoM period-cut order, QTD timezone off-by-one, norm/cumret div-by-zero, remove dead setFont code -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="screen-orientation" content="portrait">
<title>Macro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
canvas { max-width: 100%; }

/* ── Theme variables ── */
:root {
  --bg:#000000; --bg2:#0e0e10; --bg3:#1c1c1e; --bg4:#2c2c2e;
  --chart-h: 180px;
  --border:#2c2c2e; --border2:#3a3a3c;
  --text:#f5f5f7; --text2:#98989d; --text3:#636366;
  --up:#30d158; --dn:#ff453a;
  --blue:#0a84ff; --red:#ff453a; --amber:#ffd60a; --green:#30d158; --purple:#bf5af2;
  --fs: 1rem;
  --card-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
}
[data-theme="light"] {
  --bg:#ffffff; --bg2:#ffffff; --bg3:#f2f2f7; --bg4:#e5e5ea;
  --border:#e5e5ea; --border2:#d1d1d6;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#aeaeb2;
  --up:#34c759; --dn:#ff3b30;
  --blue:#007aff; --red:#ff3b30; --amber:#ff9500; --green:#34c759; --purple:#af52de;
  --card-shadow: 0 4px 16px rgba(0,0,0,0.08);
}

body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Sarabun',sans-serif; font-size:var(--fs); line-height:1.4; transition: background 0.2s, color 0.2s; }

/* ── Mobile: font ปกติ, 1 column, portrait only ── */
/* ── News page ──────────────────────────────────────── */
.news-day { margin-bottom:18px; }
.news-day-header { font-size:0.72em; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; padding:4px 0; border-bottom:1px solid var(--border); margin-bottom:10px; }
.energy-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:1200px; margin:0 auto; padding:0 16px; }
@media (max-width:700px), (orientation:portrait) and (max-width:1024px) { .energy-grid { grid-template-columns:1fr; } }
/* ตอน export PDF: เหลือแค่ 2 การ์ด (Diesel, Gasohol 95) วาง 2 คอลัมน์ให้พอดี A4 แนวนอน 1 หน้า */
#energy-boxes.pdf-export { grid-template-columns:1fr 1fr; }
#energy-boxes.pdf-export .energy-chart-box, #energy-hero.pdf-export .energy-chart-box { height:220px !important; }

/* ── TH Energy hero: Diesel / Gasohol95 / Oil Fund เด่นด้านบนสุด ── */
.energy-hero { border:1px solid var(--border); border-radius:8px; max-width:1200px; margin:0 auto 16px; padding:16px 16px 16px; box-shadow:var(--card-shadow); }
.energy-hero-grid { display:grid; grid-template-columns:repeat(3,1fr); }
.energy-hero-grid > .card { border:none; border-radius:0; border-right:1px solid var(--border); background:transparent; box-shadow:none; }
.energy-hero-grid > .card:last-child { border-right:none; }
#energy-hero.pdf-export .energy-hero-grid { grid-template-columns:repeat(3,1fr); }
@media (max-width:700px), (orientation:portrait) and (max-width:1024px) {
  .energy-hero-grid { grid-template-columns:1fr; }
  .energy-hero-grid > .card { border-right:none; border-bottom:1px solid var(--border); }
  .energy-hero-grid > .card:last-child { border-bottom:none; }
}
.news-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
@media (max-width: 700px) { .news-grid { grid-template-columns:1fr; } }
.news-source { font-size:0.68em; color:var(--blue); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
.news-title { font-size:0.82em; font-weight:600; margin-bottom:6px; line-height:1.4; }
.news-title a { color:var(--text); text-decoration:none; }
.news-title a:hover { color:var(--blue); }
.news-summary { font-size:0.78em; color:var(--text2); line-height:1.5; margin-bottom:6px; }
.news-why { font-size:0.7em; color:var(--text3); font-style:italic; }

/* ── TH Energy page ─────────────────────────────────── */
.energy-kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-bottom:14px; }
.ekpi { background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:12px 14px; }
.ekpi-group { font-size:0.7em; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }
.ekpi-name  { font-size:0.78em; color:var(--text2); margin-bottom:6px; }
.ekpi-price { font-size:1.3em; font-weight:600; color:var(--text); }
.ekpi-unit  { font-size:0.68em; color:var(--text3); margin-left:4px; }
.ekpi-date  { font-size:0.68em; color:var(--text3); margin-top:4px; }
.ekpi-chg.up{color:var(--up)} .ekpi-chg.dn{color:var(--dn)}
.energy-section { margin-bottom:18px; }
.energy-section-title { font-size:0.78em; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:4px; }

@media (max-width:700px) {
  body { font-size:var(--fs); }
  .chart-grid { grid-template-columns:1fr !important; }
}


/* ── Topbar ── */
#topbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; gap:8px; flex-wrap:wrap; min-height:fit-content; }
.brand { font-size:0.9em; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; }
.patch { font-size:0.65em; font-weight:400; color:var(--text3); margin-left:6px; }
.topbar-right { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.sdot { width:7px; height:7px; border-radius:50%; background:var(--text3); display:inline-block; }
.sdot.ok{background:var(--up)} .sdot.err{background:var(--dn)} .sdot.load{background:var(--amber)}
#stxt { font-size:0.75em; color:var(--text3); white-space:nowrap; }
.btn { background:none; border:1px solid var(--border2); color:var(--text2); padding:3px 9px; border-radius:3px; cursor:pointer; font-size:0.8em; font-family:inherit; white-space:nowrap; }
.btn:hover { border-color:var(--text2); color:var(--text); }
.btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
.btn-primary:hover { opacity:0.85; color:#fff; }

/* theme + font controls */
.ctrl-group { display:flex; align-items:center; gap:4px; }
.ctrl-label { font-size:0.7em; color:var(--text3); }
.seg { display:flex; border:1px solid var(--border2); border-radius:3px; overflow:hidden; }
.seg button { background:none; border:none; border-right:1px solid var(--border2); color:var(--text2); padding:3px 8px; cursor:pointer; font-size:0.75em; font-family:inherit; }
.seg button:last-child { border-right:none; }
.seg button.on { background:var(--bg3); color:var(--text); }
.seg button:hover { background:var(--bg3); }
input[type=range] { width:80px; accent-color:var(--blue); }

/* ── Nav ── */
#nav { display:flex; padding:0 16px; border-bottom:1px solid var(--border); align-items:center; gap:0; overflow-x:auto; }
.nb { padding:8px 14px; font-size:0.8em; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; white-space:nowrap; }
.nb:hover{color:var(--text2)} .nb.active{color:var(--text);border-bottom-color:var(--blue)}
.nb-add { color:var(--text3); font-size:1.1em; padding:8px 10px; }
.nb-add:hover{color:var(--blue)}

/* ── Pages ── */
.page { display:none; padding:14px 16px; }
.page.active { display:block; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
.page-actions { display:flex; gap:5px; flex-wrap:wrap; }

.chart-grid { display:grid; gap:16px; }

/* ── Cards ── */
.card { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg2); box-shadow:var(--card-shadow); }
.ch { padding:9px 11px 3px; display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
.ct { font-size:0.82em; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
.cs { font-size:0.72em; color:var(--text3); margin-top:2px; line-height:1.3; }
.ch-actions { display:flex; gap:2px; flex-shrink:0; }
.icon-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.82em; padding:2px 4px; font-family:inherit; }
.icon-btn:hover{color:var(--text)}
.cb { padding:2px 10px 10px; }
.tfs { display:flex; gap:1px; padding:1px 11px 5px; flex-wrap:wrap; }
.tf { font-size:0.72em; padding:1px 5px; border-radius:2px; color:var(--text3); cursor:pointer; background:none; border:none; font-family:inherit; }
.tf:hover{color:var(--text2)} .tf.on{background:var(--bg3);color:var(--text)}
.legend { display:flex; gap:10px; padding:1px 11px 7px; flex-wrap:wrap; }
.li { display:flex; align-items:center; gap:4px; font-size:0.72em; color:var(--text2); }
.ls { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.ld { padding:22px; }
.skeleton { background: linear-gradient(90deg, var(--bg3) 25%, var(--border2) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: skeleton-shimmer 1.4s ease-in-out infinite; border-radius:4px; }
@keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-chart { height:220px; width:100%; }
.skel-line { height:14px; width:70%; margin-bottom:8px; }
.skel-line.short { width:40%; }
.skel-card { height:90px; width:100%; margin-bottom:10px; }
.er { color:var(--dn); font-size:0.75em; padding:3px 11px 8px; }
.empty { padding:36px; text-align:center; color:var(--text3); font-size:0.85em; }

/* ── Modal ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto; }
.modal-bg.show { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border2); border-radius:6px; width:100%; max-width:560px; padding:18px; }
.modal h3 { font-size:0.85em; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:0.72em; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
.field input[type=text], .field select { width:100%; background:var(--bg3); border:1px solid var(--border2); color:var(--text); padding:6px 9px; border-radius:3px; font-family:inherit; font-size:0.82em; }
.field input:focus, .field select:focus { outline:none; border-color:var(--blue); }

/* series rows */
.series-header { display:grid; grid-template-columns:1fr 100px 90px 90px 26px; gap:5px; margin-bottom:4px; }
.series-header span { font-size:0.68em; color:var(--text3); text-transform:uppercase; letter-spacing:0.04em; }
.series-row { display:grid; grid-template-columns:1fr 100px 90px 90px 26px; gap:5px; margin-bottom:5px; align-items:center; }
.series-row select { background:var(--bg3); border:1px solid var(--border2); color:var(--text); padding:4px 6px; border-radius:3px; font-family:inherit; font-size:0.78em; width:100%; }
.rm-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.9em; padding:0 4px; }
.rm-btn:hover{color:var(--dn)}
.add-series-btn { font-size:0.78em; color:var(--blue); background:none; border:1px dashed var(--border2); border-radius:3px; padding:4px; width:100%; cursor:pointer; font-family:inherit; margin-top:3px; }
.add-series-btn:hover{border-color:var(--blue)}
.hint { font-size:0.68em; color:var(--text3); margin-top:3px; }
.modal-actions { display:flex; gap:7px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Macro<span class="patch">v6.6</span></div>
  <div class="topbar-right">
    <span class="sdot" id="sdot"></span>
    <span id="stxt">loading…</span>
    <button class="btn" onclick="loadData()">↻</button>
    <div style="position:relative">
      <button class="btn" id="opt-btn" onclick="toggleOptions()">⚙ Options</button>
      <div id="opt-panel" style="display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:14px 16px;min-width:220px;z-index:50;display:none;flex-direction:column;gap:12px;">
        <div class="ctrl-group">
          <span class="ctrl-label">Theme</span>
          <div class="seg">
            <button id="th-dark" class="on" onclick="setTheme('dark')">Dark</button>
            <button id="th-light" onclick="setTheme('light')">Light</button>
          </div>
        </div>
        <div class="ctrl-group" style="flex-direction:column;align-items:flex-start;gap:4px">
          <span class="ctrl-label">Font size: <span id="fs-label">100%</span></span>
          <input type="range" id="fs-range" min="100" max="300" step="10" value="100" oninput="setFont(this.value)" style="width:100%">
        </div>
        <div class="field" style="margin-bottom:0">
          <label style="display:block;font-size:0.7em;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Reference Date</label>
          <div id="ref-date-status" style="font-size:0.78em"></div>
          <div style="font-size:0.65em;color:var(--text3);margin-top:3px">จาก data/ref_dates.txt</div>
        </div>
        <div style="display:flex;gap:6px;padding-top:4px;border-top:1px solid var(--border)">
          <button class="btn" onclick="exportConfig()" style="flex:1">Export</button>
          <button class="btn" onclick="importConfig()" style="flex:1">Import</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="nav"></div>
<div id="pages"></div>

<!-- NEWS PAGE -->
<div id="page-news" class="page">
  <div class="page-head" style="margin-bottom:14px">
    <span style="font-size:0.78em;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em">Daily News</span>
    <div class="page-actions">
      <button class="btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </div>
  <div id="news-container">
    <div class="ld">
      <div class="skeleton skel-line" style="width:30%"></div>
      <div class="news-grid">
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
        <div class="skeleton skel-card"></div>
      </div>
    </div>
  </div>
</div>

<!-- TH ENERGY PAGE -->
<div id="page-th-energy" class="page">
  <div class="page-head" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:0.78em;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em">TH Energy — ราคาพลังงานไทย</span>
    <div class="page-actions">
      <button class="btn" id="energy-export-btn" onclick="exportEnergyPDF()">⬇ Export PDF</button>
      <button class="btn" onclick="openStructureModal()">ℹ โครงสร้างราคา</button>
    </div>
  </div>
  <!-- Shared legend -->
  <div style="display:flex;gap:16px;align-items:center;justify-content:center;margin-bottom:10px;font-size:0.88em;font-weight:600" id="energy-shared-legend">
    <div class="li" style="font-size:1em;font-weight:600"><span class="ls" style="background:#f5a623"></span><span id="energy-year-this">ปีนี้</span></div>
    <div class="li" style="font-size:1em;font-weight:600"><span class="ls" style="background:rgba(128,128,128,0.5)"></span><span id="energy-year-last">ปีก่อน</span></div>
    <span style="color:var(--text3)">·</span>
    <span>ข้อมูลล่าสุด <span id="energy-latest-date"></span></span>
  </div>
  <div id="energy-hero" class="energy-hero"><div id="energy-hero-grid" class="energy-hero-grid"></div></div>
  <div id="energy-boxes" class="energy-grid"></div>
</div>

<!-- META POPUP -->
<div id="meta-popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)closeMeta()">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;max-width:400px;width:100%">

// ดึงค่าแต่ละ component (รวมย่อยตาม keys) ของ product ณ วันที่ <= dateStr ล่าสุด
function getBreakdownAtDate(base, dateStr) {

// ── Reference date — อ่านจาก data/ref_dates.txt ──────────────
let _refDateCache = '';  // in-memory cache หลังโหลดครั้งแรก

async function loadRefDate() {
  try {
    const resp = await fetch('data/ref_dates.txt', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();

    const today = new Date().toISOString().slice(0, 10);
    const dates = text.split('\n')
      .map(l => l.trim())
      .filter(l => /^\d{4}-\d{2}-\d{2}$/.test(l))
      .filter(l => l <= today)
      .sort();

    _refDateCache = dates.length ? dates[dates.length - 1] : '';
  } catch (e) {
    console.warn('loadRefDate failed', e);
    _refDateCache = '';
  }
  return _refDateCache;
}

function updateRefDateStatus(val) {
  const el = document.getElementById('ref-date-status');
  if (!el) return;
  if (!val) { el.textContent = 'ไม่พบ reference date ใน data/ref_dates.txt'; el.style.color = 'var(--text3)'; return; }
  const d = new Date(val + 'T00:00:00Z');
  if (isNaN(d)) { el.textContent = '❌ format ไม่ถูก'; el.style.color='var(--dn)'; return; }
  el.textContent = '✓ Reference: ' + d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  el.style.color = 'var(--up)';
}


// format วันที่แบบ "8-Jul" หรือ "8-Jul-2026" (withYear=true)
function fmtDMon(dateStr, withYear, withWeekday) {
  const d = new Date(dateStr.slice(0,10) + 'T00:00:00Z');
  const day = d.getUTCDate();
  const mon = d.toLocaleDateString('en-GB', { month:'short', timeZone:'UTC' });
  const dmy = withYear ? `${day}-${mon}-${d.getUTCFullYear()}` : `${day}-${mon}`;
  if (!withWeekday) return dmy;
  const wd = d.toLocaleDateString('en-GB', { weekday:'short', timeZone:'UTC' });
  return `${wd} ${dmy}`;
}

// หาราคา ณ ref date (วันที่ตรงหรือใกล้ที่สุดก่อน ref date)
function priceAtDate(data, dateStr) {
  if (!dateStr || !data.length) return null;
  const ref = dateStr.slice(0,10);  // ตัดให้เหลือแค่ YYYY-MM-DD
  const pts = data.filter(p => p.x.slice(0,10) <= ref);
  if (!pts.length) return null;
  return pts[pts.length-1].y;
}

// เหมือน priceAtDate แต่คืนวันที่จริงของจุดข้อมูลที่ใช้ด้วย (ไม่ใช่แค่ค่า) — ใช้โชว์
// label "ณ วันที่" ให้ตรงกับตัวเลขจริงที่แสดง เผื่อวันอ้างอิงไม่มีข้อมูล (เช่น วันหยุด)
// แล้ว fallback ไปใช้ค่าของวันก่อนหน้าล่าสุดแทน
function pointAtDate(data, dateStr) {
  if (!dateStr || !data.length) return null;
  const ref = dateStr.slice(0,10);
  const pts = data.filter(p => p.x.slice(0,10) <= ref);
  if (!pts.length) return null;
  return pts[pts.length-1];
}

// ── Averages (+ YoY เทียบค่าเฉลี่ยช่วงเดียวกันปีก่อน) ──
function ymd(y,m,d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function daysInMonth(y,m) { return new Date(y,m,0).getDate(); } // m = 1-based

function periodAvg(data, startStr, endStr) {
  const pts = data.filter(p => p.x >= startStr && p.x <= endStr);
  return pts.length ? pts.reduce((s,p)=>s+p.y,0)/pts.length : null;
}
function yoyOf(avg, avgLY) {
  return (avg !== null && avgLY !== null && avgLY !== 0) ? (avg/avgLY-1)*100 : null;
}

// MTD: เฉลี่ย 1 ต้นเดือนถึงวันนี้ vs ช่วงวันที่เดียวกันของเดือนเดียวกันปีก่อน
function calcMTD(data) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const avg = periodAvg(data, ymd(y,m,1), ymd(y,m,d));

  const lyDay = Math.min(d, daysInMonth(y-1,m));
  const avgLY = periodAvg(data, ymd(y-1,m,1), ymd(y-1,m,lyDay));

  return { avg, yoy: yoyOf(avg, avgLY) };
}

// QTD: เฉลี่ยต้นไตรมาสถึงวันนี้ vs จำนวนวันเท่ากันนับจากต้นไตรมาสปีก่อน
function calcQTD(data) {
  const now = new Date();
  const y = now.getFullYear(), m0 = now.getMonth(); // 0-based
  const qStartMonth0 = Math.floor(m0/3)*3;
  const qStartDate   = new Date(y, qStartMonth0, 1);
  const todayMid     = new Date(y, m0, now.getDate());
  const daysElapsed  = Math.round((todayMid - qStartDate) / 86400000);

  const avg = periodAvg(data, ymd(y, qStartMonth0+1, 1), ymd(y, m0+1, now.getDate()));

  const lyQStart = new Date(y-1, qStartMonth0, 1);
  const lyEnd    = new Date(lyQStart.getTime());
  lyEnd.setDate(lyEnd.getDate() + daysElapsed);
  const avgLY = periodAvg(data,
    ymd(lyQStart.getFullYear(), lyQStart.getMonth()+1, lyQStart.getDate()),
    ymd(lyEnd.getFullYear(), lyEnd.getMonth()+1, lyEnd.getDate()));

  return { avg, yoy: yoyOf(avg, avgLY) };
}

function makeYearLabels() {
  const labels = [];
  for (let m=0; m<12; m++) {
    const days = new Date(2000, m+1, 0).getDate();
    for (let d=1; d<=days; d++)
      labels.push(`${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return labels;
}

function mapToYearAxis(data, year, yearLabels) {
  const map = {};
  data.forEach(p => { if (p.x.startsWith(String(year))) map[p.x.slice(5)] = p.y; });
  return yearLabels.map(l => map[l] ?? null);
}

let energyCharts = {};

let _structureLoaded = false;

function mdToHtml(md) {
  // simple markdown → HTML (headers, bold, code blocks, tables, hr)
  const lines = md.split('\n');
  let html = '';
  let inTable = false, tableRowIdx = 0, inCode = false;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (line.startsWith('```')) { inCode = !inCode; html += inCode ? '<pre style="background:var(--bg3);padding:10px;border-radius:4px;overflow-x:auto">' : '</pre>'; continue; }
    if (inCode) { html += line.replace(/</g,'&lt;') + '\n'; continue; }
    if (line.startsWith('---')) { html += '<hr style="border:none;border-top:1px solid var(--border);margin:18px 0">'; continue; }
    if (line.startsWith('# ')) { html += `<h2 style="font-size:1.15em;margin:0 0 12px">${line.slice(2)}</h2>`; continue; }
    if (line.startsWith('## ')) { html += `<h3 style="font-size:1.0em;font-weight:600;margin:18px 0 8px;color:var(--blue)">${line.slice(3)}</h3>`; continue; }
    if (line.startsWith('|')) {
      const cells = line.split('|').slice(1,-1).map(c=>c.trim());
      if (cells.every(c => /^-+$/.test(c))) continue;  // separator row — skip
      if (!inTable) { html += '<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:0.92em">'; inTable = true; tableRowIdx = 0; }
      const tag = tableRowIdx === 0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag} style="padding:6px 8px;border:1px solid var(--border);text-align:left">${c}</${tag}>`).join('') + '</tr>';
      tableRowIdx++;
      continue;
    } else if (inTable) { html += '</table>'; inTable = false; }
    if (!line.trim()) continue;
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html += `<p style="margin:8px 0">${line}</p>`;
  }
  if (inTable) html += '</table>';
  return html;
}

function openMetaChart(chartId) {
  // หา chart config จาก config ปัจจุบัน
  let chart = null;
  for (const page of config.pages) {
    chart = page.charts.find(c => c.id === chartId);
    if (chart) break;
  }
  if (!chart) return;

  const popup = document.getElementById('meta-popup');
  document.getElementById('meta-title').textContent = chart.title || 'Chart Info';

  const sections = chart.series.map(s => {
    const ser = SERIES[s.id];
    if (!ser) return '';
    const m = ser.meta || {};
    const rows = [
      ['Full name', m.fullName],
      ['Unit',      m.unit],
      ['Currency',  m.currency],
      ['Frequency', m.freq],
      ['Source',    m.source],
      ['Updated',   ser.updated ? ser.updated.slice(0,10) : ''],
    ].filter(([,v]) => v).map(([k,v]) =>
      `<div style="display:flex;gap:8px;border-bottom:1px solid var(--border);padding:5px 0">
        <span style="color:var(--text3);width:90px;flex-shrink:0">${k}</span>
        <span>${v}</span>
      </div>`
    ).join('');
    return `<div style="margin-bottom:12px">
      <div style="font-size:0.78em;font-weight:600;margin-bottom:6px;color:var(--blue)">${ser.name}</div>
      ${rows || '<span style="color:var(--text3)">ไม่มี metadata</span>'}
    </div>`;
  }).join('');

  document.getElementById('meta-body').innerHTML = sections || '<span style="color:var(--text3)">ไม่มีข้อมูล</span>';
  popup.style.display = 'flex';
}

function toggleBreakdown(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  const newDisplay = isHidden ? 'block' : 'none';
  const newArrow   = isHidden ? '▴' : '▾';

  // Diesel/Gasohol 95 ผูก state กัน — toggle อันไหนก็ toggle ทั้งคู่พร้อมกัน
  const ids = BREAKDOWN_LINKED_IDS.includes(id) ? BREAKDOWN_LINKED_IDS : [id];
  ids.forEach(i => {
    const e = document.getElementById(i);
    const a = document.getElementById(i + '-arrow');
    if (e) e.style.display = newDisplay;
    if (a) a.textContent = newArrow;
  });
}

function closeMeta() { document.getElementById('meta-popup').style.display = 'none'; }


async function openStructureModal() {
  const modal = document.getElementById('structure-modal');
  const content = document.getElementById('structure-content');
  modal.style.display = 'flex';
  if (_structureLoaded) return;
  content.innerHTML = '<div class="ld"><div class="skeleton skel-line"></div><div class="skeleton skel-line short"></div></div>';
  try {
    const resp = await fetch('eppo_structure.md', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    content.innerHTML = mdToHtml(md);
    _structureLoaded = true;
  } catch (e) {
    content.innerHTML = '<div class="empty">โหลด eppo_structure.md ไม่สำเร็จ</div>';
  }
}

function closeStructureModal() {
  document.getElementById('structure-modal').style.display = 'none';
}

async function renderEnergyPage() {
  const container = document.getElementById('energy-boxes');
  const heroGrid  = document.getElementById('energy-hero-grid');
  if (!container || !heroGrid) return;
  if (Object.keys(SERIES).length === 0) {
    container.innerHTML = `<div class="ld" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
      ${Array(9).fill('<div class="skeleton skel-card"></div>').join('')}
    </div>`;
    heroGrid.innerHTML = `<div class="ld" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${Array(3).fill('<div class="skeleton skel-card"></div>').join('')}
    </div>`;
    return;
  }

  container.innerHTML = '';
  heroGrid.innerHTML = '';
  Object.values(energyCharts).forEach(c => c.destroy());
  energyCharts = {};

  // auto-select reference date จาก data/ref_dates.txt
  const savedRef = await loadRefDate();
  updateRefDateStatus(savedRef);

  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  // อัพเดท shared legend
  const lyEl = document.getElementById('energy-year-this');
  const llEl = document.getElementById('energy-year-last');
  if (lyEl) lyEl.textContent = String(thisYear);
  if (llEl) llEl.textContent = String(lastYear);
  const yearLabels = makeYearLabels();
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const tickSet = new Set();
  yearLabels.forEach((l,i) => { if (l.endsWith('-01')) tickSet.add(i); });
  const tickColor = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim() || '#555';

  let latestPriceDate = '';

  for (const prod of EPPO_ORDER) {
    const sRetail   = getEppoSeries(prod.base, prod.field);
    if (!sRetail || !sRetail.data.length) continue;

    const data    = sRetail.data;
    const last    = data[data.length-1];
    if (last.x > latestPriceDate) latestPriceDate = last.x;
    const mtd     = calcMTD(data);
    const qtd     = calcQTD(data);

    // RTD — ref date เปรียบเทียบกับราคา ณ วันนั้น
    let rtdHtml = '';
    const refStr = savedRef ? savedRef.trim() : '';
    if (refStr) {
      // หาราคา ณ ref date (วันที่ <= refStr ล่าสุด) — ใช้ pointAtDate เพื่อเอา "วันที่จริง"
      // ของจุดข้อมูลที่ใช้มาโชว์ label ด้วย เผื่อ ref date ไม่มีข้อมูล (เช่นวันหยุด) แล้ว
      // fallback ไปวันก่อนหน้า — กันตัวเลขกับวันที่ที่โชว์ไม่ตรงกัน
      const refPoint = pointAtDate(data, refStr);
      const refPrice = refPoint ? refPoint.y : null;
      if (refPrice !== null && refPrice !== 0 && last.x > refStr) {
        const rtd = (last.y - refPrice) / refPrice * 100;
        const rtdColor = rtd >= 0 ? 'var(--dn)' : 'var(--up)';
        const refD = new Date(refPoint.x + 'T00:00:00Z').toLocaleDateString('en-US',{day:'numeric',month:'short',timeZone:'UTC'});
        rtdHtml = `<div style="padding:8px 12px">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">vs ${refD}</div>
          <div style="font-size:1.0em;font-weight:600;color:${rtdColor}">${rtd>=0?'+':''}${rtd.toFixed(1)}%</div>
        </div>`;
      }
    }

    // Breakdown โครงสร้างราคา ณ วันล่าสุด และ ณ ref date
    const lastDateStr = last.x;
    const breakdownLast = getBreakdownAtDate(prod.base, lastDateStr);
    const breakdownRef  = refStr ? getBreakdownAtDate(prod.base, refStr) : null;

    // สร้าง 1 แถวของตาราง breakdown (ใช้ร่วมกันทั้ง Ex-Refin / 4 component / Retail)
    const makeBreakdownRow = (label, vLast, vRef, bold) => {
      let flagColor = '', arrow = '';
      if (vLast !== null && vRef !== null && Math.abs(vLast - vRef) > 0.0001) {
        if (vLast > vRef) { flagColor = '#e53935'; arrow = '↑'; }
        else              { flagColor = '#43a047'; arrow = '↓'; }
      }
      const boldStyle = bold ? 'font-weight:600;' : '';
      const numStyle  = `padding:5px 4px 5px 8px;text-align:right;${boldStyle}${flagColor ? `color:${flagColor};font-weight:600` : ''}`;
      const arrowStyle = `padding:5px 8px 5px 2px;width:14px;color:${flagColor}`;

      return `<tr style="${bold ? 'font-weight:600' : ''}">
        <td style="padding:5px 8px;color:var(--text2)">${label}</td>
        <td style="${numStyle}">${vLast !== null ? vLast.toFixed(4) : '—'}</td>
        <td style="${arrowStyle}">${arrow}</td>
        ${refStr ? `<td style="padding:5px 8px;text-align:right;color:var(--text3)">${vRef !== null ? vRef.toFixed(4) : '—'}</td>` : ''}
      </tr>`;
    };

    // บรรทัดแรก: ราคาหน้าโรงกลั่น (Ex-Refinery)
    const sExRefin    = getEppoSeries(prod.base, 'EX_REFIN');
    const exRefinLast  = sExRefin ? priceAtDate(sExRefin.data, lastDateStr) : null;
    const exRefinRef   = sExRefin && refStr ? priceAtDate(sExRefin.data, refStr) : null;

    // ส่วนลดจากราคาหน้าโรงกลั่น (DISCOUNT) — เฉพาะ DIESEL เท่านั้นที่มีค่านี้จริง
    // (product อื่นไม่มีคอลัมน์นี้เลย/ไม่เคยลด) ย้อนหลังก่อนที่ field นี้จะถูกเก็บ
    // (ก่อน ก.ค. 2569) ให้ถือเป็น 0 แทนที่จะเป็นค่าว่าง
    const isDiesel = prod.base === 'DIESEL';
    const sDiscount = isDiesel ? getEppoSeries(prod.base, 'DISCOUNT') : null;
    const discountAtDateOrZero = (dateStr) => {
      if (!dateStr) return null;
      if (!sDiscount || !sDiscount.data.length) return 0;
      const v = priceAtDate(sDiscount.data, dateStr);
      return v !== null ? v : 0;
    };
    const discountLast = isDiesel ? discountAtDateOrZero(lastDateStr) : null;
    const discountRef  = isDiesel && refStr ? discountAtDateOrZero(refStr) : null;
    const discountRowHtml = isDiesel
      ? makeBreakdownRow('ส่วนลดหน้าโรงกลั่น', discountLast, discountRef, false)
      : '';

    // บรรทัดสุดท้าย: ราคาหน้าปั๊ม/หน้าคลัง (Retail หรือ Wholesale ตามแต่ละสินค้า)
    const endLabel = prod.field === 'RETAIL' ? 'Retail Price (หน้าปั๊ม)' : 'Wholesale Price (หน้าคลัง)';
    const endLast   = last.y;
    // ใช้ pointAtDate เอาทั้งค่าและ "วันที่จริง" ของจุดที่ใช้แสดงหัวคอลัมน์ ref date —
    // กันกรณี ref date ไม่มีข้อมูล (เช่นวันหยุด) แล้วเลข fallback ไปวันอื่นแต่หัวตาราง
    // ยังโชว์วันเดิม ทำให้ตัวเลขกับวันที่ไม่ตรงกัน
    const refPointMain = refStr ? pointAtDate(data, refStr) : null;
    const endRef       = refPointMain ? refPointMain.y : null;
    const refEffectiveDateStr = refPointMain ? refPointMain.x : refStr;

    const breakdownRows =
      makeBreakdownRow('ราคาหน้าโรงกลั่น', exRefinLast, exRefinRef, true) +
      discountRowHtml +
      BREAKDOWN_FIELDS.map((f, i) =>
        makeBreakdownRow(f.label, breakdownLast[i].value, breakdownRef ? breakdownRef[i].value : null, false)
      ).join('') +
      makeBreakdownRow(endLabel, endLast, endRef, true);

    const fmtDate = (iso) => {
      const d = new Date(iso + 'T00:00:00Z');
      return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', timeZone:'UTC'});
    };

    const lastHeader = `ล่าสุด · ${fmtDate(lastDateStr)}`;
    const refColHeader = refStr
      ? `<th style="padding:5px 8px;text-align:right;font-weight:400;color:var(--text3)">${fmtDate(refEffectiveDateStr)}</th>`
      : '';
    const arrowHeader = `<th style="width:14px"></th>`;

    const breakdownId = 'bd-' + prod.base.replace(/[^A-Za-z0-9]/g,'_');
    const isDefaultOpen = BREAKDOWN_DEFAULT_OPEN_BASES.includes(prod.base);
    const breakdownHtml = `
      <div style="border-top:1px solid var(--border)">
        <button class="btn" style="width:100%;border:none;border-radius:0;text-align:left;font-size:0.75em;padding:7px 12px;display:flex;justify-content:space-between;align-items:center" onclick="toggleBreakdown('${breakdownId}')">
          <span>โครงสร้างราคา</span>
          <span id="${breakdownId}-arrow">${isDefaultOpen ? '▴' : '▾'}</span>
        </button>
        <div id="${breakdownId}" style="display:${isDefaultOpen ? 'block' : 'none'};padding:0 12px 10px">
          <table style="width:100%;border-collapse:collapse;font-size:0.78em;table-layout:fixed">
            <thead><tr>
              <th style="width:42%;padding:5px 8px;text-align:left;font-weight:400;color:var(--text3)"></th>
              <th style="padding:5px 4px 5px 8px;text-align:right;font-weight:400;color:var(--text3)">${lastHeader}</th>
              ${arrowHeader}
              ${refColHeader}
            </tr></thead>
            <tbody>${breakdownRows}</tbody>
          </table>
        </div>
      </div>`;

    const canvasId = 'ec-' + prod.base.replace(/[^A-Za-z0-9]/g,'_');
    const box = document.createElement('div');
    box.className = 'card';
    box.dataset.base = prod.base;
    box.innerHTML = `
      <div class="ch" style="padding:10px 12px 6px">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
          <div class="ct" style="color:${prod.color}">${prod.label}</div>
          <div class="cs">${prod.unit}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:${rtdHtml ? 'repeat(4,1fr)' : 'repeat(3,1fr)'};border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
        <div style="padding:8px 12px;border-right:1px solid var(--border)">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">ล่าสุด · ${fmtDMon(last.x)}</div>
          <div style="font-size:1.4em;font-weight:600;color:${prod.color}">${last.y.toFixed(2)}</div>
        </div>
        <div style="padding:8px 12px;border-right:1px solid var(--border)">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">MTD avg</div>
          <div style="font-size:1.05em;font-weight:600">${mtd.avg !== null ? mtd.avg.toFixed(2) : '—'}</div>
          ${mtd.yoy !== null ? `<div style="font-size:0.68em;font-weight:600;color:${mtd.yoy>=0?'var(--dn)':'var(--up)'}">YoY ${mtd.yoy>=0?'+':''}${mtd.yoy.toFixed(1)}%</div>` : ''}
        </div>
        <div style="padding:8px 12px;${rtdHtml ? 'border-right:1px solid var(--border)' : ''}">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">QTD avg</div>
          <div style="font-size:1.05em;font-weight:600">${qtd.avg !== null ? qtd.avg.toFixed(2) : '—'}</div>
          ${qtd.yoy !== null ? `<div style="font-size:0.68em;font-weight:600;color:${qtd.yoy>=0?'var(--dn)':'var(--up)'}">YoY ${qtd.yoy>=0?'+':''}${qtd.yoy.toFixed(1)}%</div>` : ''}
        </div>
        ${rtdHtml}
      </div>
      <div style="padding:14px 12px 16px">
        <div class="energy-chart-box" style="position:relative;height:140px"><canvas id="${canvasId}"></canvas></div>
      </div>
      ${breakdownHtml}`;

    const isHeroProd = prod.base === 'DIESEL' || prod.base === 'GASOHOL 95';
    (isHeroProd ? heroGrid : container).appendChild(box);

    const thisData = mapToYearAxis(data, thisYear, yearLabels);
    const lastData = mapToYearAxis(data, lastYear, yearLabels);
    const xLabels  = yearLabels.map((l,i) => tickSet.has(i) ? monthNames[parseInt(l.slice(0,2))-1] : '');

    const canvas = document.getElementById(canvasId);
    if (!canvas) continue;

    // รอให้ browser paint ก่อน Chart.js วัด canvas size
    await new Promise(r => requestAnimationFrame(r));

    // ref date line annotation (ถ้ามี)
    const refLinePlugin = savedRef ? [{
      id: 'refLine',
      afterDraw(chart) {
        const refMmdd = savedRef.slice(5); // MM-DD
        const idx = yearLabels.indexOf(refMmdd);
        if (idx < 0) return;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data[idx]) return;
        const x = meta.data[idx].x;
        const ctx2 = chart.ctx;
        ctx2.save();
        ctx2.strokeStyle = 'rgba(245,166,35,0.6)';
        ctx2.setLineDash([4,3]);
        ctx2.lineWidth = 1;
        ctx2.beginPath();
        ctx2.moveTo(x, chart.chartArea.top);
        ctx2.lineTo(x, chart.chartArea.bottom);
        ctx2.stroke();
        ctx2.restore();
      }
    }] : [];

    // คำนวณ zoom range: last month -4 (วันที่ 1) ถึง +2 (สิ้นเดือน)
    // clamp ไว้ในปีเดียว (1–12) ไม่ wrap ข้ามปี เพราะ yearLabels เป็น array
    // ม.ค.–ธ.ค. ปีเดียว ถ้า wrap ข้ามปีจะได้ zoomStart index > zoomEnd index
    // (min > max) กราฟแสดงผลผิดเพี้ยน — เดือนล่าสุดใกล้ต้น/ท้ายปีจะได้ช่วงซูม
    // สั้นกว่าปกติ (ไม่ครบ 6 เดือน) แทนที่จะ wrap
    const latestMmDd = last.x.slice(5);  // "MM-DD"
    const latestMon  = parseInt(latestMmDd.slice(0,2), 10);
    const zoomStart  = Math.max(1, latestMon - 4);   // เดือนเริ่ม
    const zoomEnd    = Math.min(12, latestMon + 2);  // เดือนสิ้นสุด
    const zoomStartStr = String(zoomStart).padStart(2,'0') + '-01';
    const zoomEndDay   = new Date(2000, zoomEnd, 0).getDate();
    const zoomEndStr   = String(zoomEnd).padStart(2,'0') + '-' + String(zoomEndDay).padStart(2,'0');
    const zoomMinIdx   = yearLabels.indexOf(zoomStartStr);
    const zoomMaxIdx   = yearLabels.indexOf(zoomEndStr);

    energyCharts[canvasId] = new Chart(canvas, {
      type: 'line',
      plugins: refLinePlugin,
      data: {
        labels: yearLabels,
        datasets: [
          { label: String(lastYear), data: lastData,
            borderColor:'rgba(128,128,128,0.35)', borderWidth:1.2,
            pointRadius:0, tension:0, fill:false, spanGaps:true },
          { label: String(thisYear), data: thisData,
            borderColor: '#f5a623', borderWidth:1.8,
            pointRadius:0, tension:0, fill:false, spanGaps:true }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false, animation:false,
        layout:{ padding:{ right:6, left:2 } },
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim()||'#1a1a1a',
            borderColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--border2').trim()||'#444',
            borderWidth:1,
            titleColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#aaa',
            bodyColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e8e8e8',
            titleFont:{family:'monospace',size:11},bodyFont:{family:'monospace',size:12},
            callbacks:{
              title: items => yearLabels[items[0]?.dataIndex] || '',
              label: item => item.raw === null ? null :
                ' ' + item.dataset.label + ': ' + Number(item.raw).toFixed(2)
            }
          }
        },
        scales:{
          x:{ type:'category', labels:yearLabels,
            min: zoomMinIdx, max: zoomMaxIdx,
            ticks:{ color:tickColor, font:{family:'monospace',size:10},
              maxRotation:0, autoSkip:false, maxTicksLimit:9999,
              // ใช้ val (index จริงใน yearLabels เต็มปี) ไม่ใช่ idx (ตำแหน่งใน tick ที่
              // แสดงจริงหลังตัด min/max) — ตอนซูมกราฟ idx จะนับใหม่จาก 0 ทำให้ label
              // เพี้ยนไปหลายเดือนจากของจริง (เช่น โชว์ Jan แทนที่จะเป็น Mar)
              callback:(val) => xLabels[val] || '' },
            grid:{ color: ctx => tickSet.has(ctx.tick?.value ?? ctx.index) ? 'rgba(128,128,128,0.1)' : 'transparent' },
            border:{color:'rgba(128,128,128,0.15)'} },
          y:{ position:'left',
            ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5},
            grid:{color:'rgba(128,128,128,0.08)'},
            border:{color:'rgba(128,128,128,0.15)'} }
        }
      }
    });
    energyCharts[canvasId].$zoomRange = { min: zoomMinIdx, max: zoomMaxIdx };
  }

  // ── Oil Fund Status (ฐานะกองทุนน้ำมันเชื้อเพลิงสุทธิ) ───────────
  // hero card คู่กับ Diesel/Gasohol95 — area chart ย้อนหลัง 18 เดือน + คาดการณ์
  // ไปข้างหน้า 6 เดือน (เส้นประ) โดยประมาณจาก flow เฉลี่ยต่อวันล่าสุด
  const sOilFundTotal = SERIES['OFFO_OILFUND_NET_TOTAL'];
  if (sOilFundTotal && sOilFundTotal.data.length) {
    const ofData = sOilFundTotal.data;
    const ofLast = ofData[ofData.length - 1];
    const ofPrev = ofData.length > 1 ? ofData[ofData.length - 2] : null;
    const ofCanvasId = 'ec-oilfund-net-total';

    const daysBetweenISO = (a,b) => (new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z')) / 86400000;
    const gapDays   = ofPrev ? daysBetweenISO(ofPrev.x, ofLast.x) : null;
    const dailyFlow = (ofPrev && gapDays > 0) ? (ofLast.y - ofPrev.y) / gapDays : 0;

    // คาดการณ์: ฐานะสิ้นปีนี้ = ล่าสุด + วันที่เหลือของปี × flow เฉลี่ยต่อวันล่าสุด
    //           ฐานะสิ้นปีหน้า = ฐานะสิ้นปีนี้ + flow เฉลี่ยต่อวันล่าสุด × 365
    const lastD = new Date(ofLast.x + 'T00:00:00Z');
    const ofThisYear = lastD.getUTCFullYear();
    const ofNextYear = ofThisYear + 1;
    const thisYearEndD    = new Date(Date.UTC(ofThisYear, 11, 31));
    const remDaysThisYear = Math.max(0, (thisYearEndD - lastD) / 86400000);
    const projThisYearEnd = ofLast.y + remDaysThisYear * dailyFlow;
    const projNextYearEnd = projThisYearEnd + dailyFlow * 365;

    const fmtSigned = n => (n >= 0 ? '+' : '') + Math.round(n).toLocaleString('en-US');
    const fmtPlain  = n => Math.round(n).toLocaleString('en-US');
    const colorOf   = n => n >= 0 ? 'var(--up)' : 'var(--dn)';

    const ofBox = document.createElement('div');
    ofBox.className = 'card';
    ofBox.dataset.base = 'OIL_FUND_STATUS';
    ofBox.innerHTML = `
      <div class="ch" style="padding:10px 12px 6px">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
          <div class="ct" style="color:#4d9fff">Oil Fund Status</div>
          <div class="cs">ฐานะกองทุนน้ำมันสุทธิ · ล้านบาท</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
        <div style="padding:8px 10px;border-right:1px solid var(--border);height:72px">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">ล่าสุด · ${fmtDMon(ofLast.x)}</div>
          <div style="font-size:1.25em;font-weight:600;color:${ofLast.y >= 0 ? '#4d9fff' : '#f05252'}">${fmtPlain(ofLast.y)}</div>
        </div>
        <div style="padding:8px 10px;border-right:1px solid var(--border);height:72px">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">Flow/วัน ล่าสุด</div>
          <div style="font-size:1.05em;font-weight:600;color:${colorOf(dailyFlow)}">${fmtSigned(dailyFlow)}</div>
        </div>
        <div style="padding:8px 10px;border-right:1px solid var(--border);height:72px">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">คาดสิ้นปี ${ofThisYear}</div>
          <div style="font-size:1.05em;font-weight:600;color:${colorOf(projThisYearEnd)}">${fmtPlain(projThisYearEnd)}</div>
        </div>
        <div style="padding:8px 10px;height:72px">
          <div style="font-size:0.68em;color:var(--text3);margin-bottom:2px">คาดสิ้นปี ${ofNextYear}</div>
          <div style="font-size:1.05em;font-weight:600;color:${colorOf(projNextYearEnd)}">${fmtPlain(projNextYearEnd)}</div>
        </div>
      </div>
      <div style="padding:14px 12px 16px;width:390px;height:170px">
        <div class="energy-chart-box" style="position:relative;height:140px"><canvas id="${ofCanvasId}"></canvas></div>
      </div>`;
    heroGrid.appendChild(ofBox);

    const ofCanvas = document.getElementById(ofCanvasId);
    if (ofCanvas) {
      await new Promise(r => requestAnimationFrame(r));

      // ช่วงแสดงผล: ย้อนหลัง 18 เดือนจากจุดข้อมูลล่าสุด + คาดการณ์ไปข้างหน้า 6 เดือน
      const startD = new Date(lastD); startD.setUTCMonth(startD.getUTCMonth() - 18);
      const endD   = new Date(lastD); endD.setUTCMonth(endD.getUTCMonth() + 6);

      const actualPts = ofData.filter(p => {
        const d = new Date(p.x + 'T00:00:00Z');
        return d >= startD && d <= lastD;
      });

      // เส้นคาดการณ์รายสัปดาห์ต่อจากจุดล่าสุด (linear ตาม dailyFlow)
      const projPts = [{ x: ofLast.x, y: ofLast.y }];
      {
        let d = new Date(lastD);
        while (d < endD) {
          d = new Date(d.getTime() + 7*86400000);
          const days = (d - lastD) / 86400000;
          projPts.push({ x: d.toISOString().slice(0,10), y: ofLast.y + dailyFlow*days });
        }
      }

      const ofLabels   = [...new Set([...actualPts.map(p=>p.x), ...projPts.map(p=>p.x)])].sort();
      const mapActual  = Object.fromEntries(actualPts.map(p=>[p.x,p.y]));
      const mapProj    = Object.fromEntries(projPts.map(p=>[p.x,p.y]));
      const dataActual = ofLabels.map(l => mapActual[l] ?? null);
      const dataProj   = ofLabels.map(l => mapProj[l] ?? null);

      // tick/grid ที่จุดแรกสุดของแต่ละไตรมาส (Q1 ม.ค. / Q2 เม.ย. / Q3 ก.ค. / Q4 ต.ค.)
      // — หา index แรกใน ofLabels ที่เข้าไตรมาสใหม่ (ข้อมูลจริงเป็นรายสัปดาห์ ไม่ตรง
      // วันที่ 1 พอดีเป๊ะ เลยใช้ "รายการแรกที่พบในไตรมาสนั้น" แทนวันที่ 1 ตรงๆ)
      const ofQuarterTickSet = new Set();
      {
        let lastQKey = null;
        ofLabels.forEach((l, i) => {
          const d = new Date(l + 'T00:00:00Z');
          const qKey = d.getUTCFullYear() + '-' + Math.floor(d.getUTCMonth() / 3);
          if (qKey !== lastQKey) { ofQuarterTickSet.add(i); lastQKey = qKey; }
        });
      }

      // วาดเส้น y=0 เองให้ชัดเจน (ไม่พึ่ง gridline ซึ่งอาจไม่ตรง tick พอดี)
      const zeroLinePlugin = {
        id: 'ofZeroLine',
        afterDraw(chart) {
          const yScale = chart.scales.y;
          if (!yScale) return;
          const yZero = yScale.getPixelForValue(0);
          if (yZero < chart.chartArea.top || yZero > chart.chartArea.bottom) return;
          const ctx2 = chart.ctx;
          ctx2.save();
          ctx2.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim() || '#888';
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(chart.chartArea.left, yZero);
          ctx2.lineTo(chart.chartArea.right, yZero);
          ctx2.stroke();
          ctx2.restore();
        }
      };
      // เส้นประคั่นระหว่างข้อมูลจริงกับช่วงคาดการณ์ ที่จุดข้อมูลล่าสุด
      const todayLinePlugin = {
        id: 'ofTodayLine',
        afterDraw(chart) {
          const idx = ofLabels.indexOf(ofLast.x);
          const meta = chart.getDatasetMeta(0);
          if (idx < 0 || !meta.data[idx]) return;
          const x = meta.data[idx].x;
          const ctx2 = chart.ctx;
          ctx2.save();
          ctx2.strokeStyle = 'rgba(128,128,128,0.5)';
          ctx2.setLineDash([3,3]);
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(x, chart.chartArea.top);
          ctx2.lineTo(x, chart.chartArea.bottom);
          ctx2.stroke();
          ctx2.restore();
        }
      };

      // สีเส้น/พื้นที่ตามเครื่องหมาย: ติดลบ = แดง/ชมพู, บวก = เขียว/เขียวอ่อน
      const ofNegColor  = getComputedStyle(document.documentElement).getPropertyValue('--dn').trim() || '#ff453a';
      const ofPosColor  = getComputedStyle(document.documentElement).getPropertyValue('--up').trim() || '#34c759';
      const ofNegFill   = 'rgba(255,99,132,0.22)';   // ชมพู
      const ofPosFill   = 'rgba(52,199,89,0.18)';    // เขียวอ่อน
      const ofSegColor = ctx => {
        const y0 = ctx.p0?.parsed?.y, y1 = ctx.p1?.parsed?.y;
        const neg = (y0 !== null && y0 !== undefined && y0 < 0) || (y1 !== null && y1 !== undefined && y1 < 0);
        return neg ? ofNegColor : ofPosColor;
      };
      const ofSegFill = ctx => {
        const y0 = ctx.p0?.parsed?.y, y1 = ctx.p1?.parsed?.y;
        const neg = (y0 !== null && y0 !== undefined && y0 < 0) || (y1 !== null && y1 !== undefined && y1 < 0);
        return neg ? ofNegFill : ofPosFill;
      };

      energyCharts[ofCanvasId] = new Chart(ofCanvas, {
        type: 'line',
        plugins: [zeroLinePlugin, todayLinePlugin],
        data: {
          labels: ofLabels,
          datasets: [
            { label: 'Net Total', data: dataActual,
              segment: { borderColor: ofSegColor, backgroundColor: ofSegFill },
              borderWidth:1.8, pointRadius:0, tension:0.15, fill:{ target:'origin' }, spanGaps:true },
            { label: 'คาดการณ์', data: dataProj,
              segment: { borderColor: ofSegColor },
              borderDash:[5,3],
              borderWidth:1.5, pointRadius:0, tension:0, fill:false, spanGaps:true }
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false, animation:false,
          layout:{ padding:{ right:6, left:2 } },
          interaction:{mode:'index',intersect:false},
          plugins:{
            legend:{display:false},
            tooltip:{
              backgroundColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim()||'#1a1a1a',
              borderColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--border2').trim()||'#444',
              borderWidth:1,
              titleColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#aaa',
              bodyColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e8e8e8',
              titleFont:{family:'monospace',size:11},bodyFont:{family:'monospace',size:12},
              callbacks:{
                label: item => item.raw === null ? null : ' ' + item.dataset.label + ': ' + Number(item.raw).toFixed(0)
              }
            }
          },
          scales:{
            x:{ type:'category', ticks:{ color:tickColor, font:{family:'monospace',size:9},
                maxRotation:0, autoSkip:false, maxTicksLimit:9999,
                // val = index จริงใน ofLabels เต็มช่วง ไม่ใช่ idx (ตำแหน่งใน tick ที่
                // แสดงจริง) — ใช้ idx จะได้ label เดือนผิด แสดง label เฉพาะจุดแรกสุด
                // ของแต่ละไตรมาส (ofQuarterTickSet) ตัวอื่นเว้นว่างไว้
                callback:(val) => {
                  if (!ofQuarterTickSet.has(val)) return '';
                  const l = ofLabels[val]; if (!l) return '';
                  const d = new Date(l+'T00:00:00Z');
                  const mon = d.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'});
                  return mon + String(d.getUTCFullYear()).slice(-2);
                } },
              grid:{ color: ctx => ofQuarterTickSet.has(ctx.tick?.value ?? ctx.index) ? 'rgba(128,128,128,0.15)' : 'transparent' },
              border:{color:'rgba(128,128,128,0.15)'} },
            y:{ position:'left',
              ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5},
              grid:{color:'rgba(128,128,128,0.08)'},
              border:{color:'rgba(128,128,128,0.15)'} }
          }
        }
      });
    }
  }

  // อัพเดทวันที่ข้อมูลราคาน้ำมันล่าสุด ข้าง legend
  const ldEl = document.getElementById('energy-latest-date');
  if (ldEl) ldEl.textContent = latestPriceDate ? fmtDMon(latestPriceDate, true, true) : '';
}

// ════════════════════════════════════════════════════
//  TRANSFORMS
// ════════════════════════════════════════════════════
function cutByPeriod(data, period) {
  if (period==='max'||!data.length) return data;
  const months = PERIOD_MONTHS[period]??12;
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth()-months);
  const cs = cutoff.toISOString().slice(0,10);
  return data.filter(p=>p.x>=cs);
}

function applyFn(data, fn) {
  if (!data.length) return data;
  switch(fn) {
    case 'raw':    return data;
    case 'norm':   { const b=data.find(d=>d.y!==0)?.y; return b ? data.map(d=>({x:d.x,y:+(d.y/b*100).toFixed(2)})) : data.map(d=>({x:d.x,y:null})); }
    case 'cumret': { const b=data.find(d=>d.y!==0)?.y; return b ? data.map(d=>({x:d.x,y:+((d.y/b-1)*100).toFixed(2)})) : data.map(d=>({x:d.x,y:null})); }
    case 'yoy':    return lookbackPct(data,365);
    case 'mom':    return lookbackPct(data,30);
    case 'ma20':   return movAvg(data,20);
    case 'ma50':   return movAvg(data,50);
    default:       return data;
  }
}

function lookbackPct(data, days) {
  const out=[];
  for (let i=0;i<data.length;i++) {
    const tgt = new Date(new Date(data[i].x)-days*86400000).toISOString().slice(0,10);
    let ref=null;
    for (let j=i-1;j>=0;j--) { if(data[j].x<=tgt){ref=data[j];break;} }
    if (ref&&ref.y!==0) out.push({x:data[i].x, y:+((data[i].y/ref.y-1)*100).toFixed(2)});
  }
  return out;
}

function movAvg(data,n) {
  const out=[];
  for (let i=n-1;i<data.length;i++) {
    let s=0; for(let j=i-n+1;j<=i;j++) s+=data[j].y;
    out.push({x:data[i].x, y:+(s/n).toFixed(2)});
  }
  return out;
}

  head.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:0.78em;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em">${page.name}</span>
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-size:0.7em;color:var(--text3)">All:</span>
        <div class="seg" id="gp-${page.id}">
          ${['3m','6m','1y','3y','10y','max'].map(p=>`<button onclick="setGlobalPeriod('${page.id}','${p}',this)" class="${curGlobal===p?'on':''}">${p.toUpperCase()}</button>`).join('')}
          <button onclick="setGlobalPeriod('${page.id}','',this)" class="${!curGlobal?'on':''}">Per chart</button>
        </div>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="openChartModal('${page.id}')">+ Chart</button>
      <button class="btn" onclick="editPage('${page.id}')">Edit page</button>
      <button class="btn" onclick="deletePage('${page.id}')">Delete</button>
    </div>`;
  el.appendChild(head);

  if (!page.charts.length) {
    el.innerHTML+='<div class="empty">ยังไม่มี chart<br><button class="btn btn-primary" style="margin-top:10px" onclick="openChartModal(\''+page.id+'\')">+ Add Chart</button></div>';
  } else {
    const grid=document.createElement('div');
    grid.className='chart-grid';
    const cols=page.cols||0;
    const savedFont = parseInt(localStorage.getItem('macro:font')||'100');
    const minW = savedFont <= 150 ? 360 : savedFont <= 200 ? 480 : 600;
    grid.style.gridTemplateColumns = cols>0 ? `repeat(${cols},1fr)` : `repeat(auto-fill,minmax(${minW}px,1fr))`;
    page.charts.forEach(chart=>grid.appendChild(makeCard(page,chart)));
    el.appendChild(grid);
  }

  container.appendChild(el);
  page.charts.forEach(chart=>drawChart(page,chart));
}

function makeCard(page,chart) {
  const seriesDesc = chart.series.map(s=>`${SERIES[s.id]?.name||s.id}(${FN_LABEL[s.fn]||s.fn})`).join(' · ');
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="ch">
      <div><div class="ct">${chart.title}</div><div class="cs">${seriesDesc}</div></div>
      <div class="ch-actions">
        <button class="icon-btn" title="Info" onclick="openMetaChart('${chart.id}')">ℹ</button>
        <button class="icon-btn" title="Edit" onclick="openChartModal('${page.id}','${chart.id}')">✎</button>
        <button class="icon-btn" title="Delete" onclick="deleteChart('${page.id}','${chart.id}')">✕</button>
      </div>
    </div>
    <div class="tfs" id="tfs-${chart.id}"></div>
    <div class="cb"><div style="position:relative;height:var(--chart-h,180px)">
      <div class="ld" id="ld-${chart.id}" style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px;padding:8px">
        ${Array(24).fill(0).map(()=>`<div class="skeleton" style="flex:1;height:${20+Math.random()*70}%;animation-delay:${Math.random()*0.6}s"></div>`).join('')}
      </div>
      <canvas id="cv-${chart.id}" style="display:none"></canvas>
    </div></div>
    <div class="legend" id="lg-${chart.id}"></div>
    <div class="er" id="er-${chart.id}"></div>`;

  setTimeout(()=>{
    const tfs=card.querySelector('#tfs-'+chart.id);
    ['3m','6m','1y','3y','10y','max'].forEach(p=>{
      const b=document.createElement('button');
      b.className='tf'+(p===chart.period?' on':'');
      b.textContent=p.toUpperCase();
      b.onclick=()=>{
        // reset global period เมื่อเลือก per-chart
        const pg = config.pages.find(x=>x.id===page.id);
        if (pg) { pg.globalPeriod=''; saveConfig(); }
        // reset global seg
        const gp = document.getElementById('gp-'+page.id);
        if (gp) {
          gp.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
          const perChart = [...gp.querySelectorAll('button')].find(x=>x.textContent==='Per chart');
          if (perChart) perChart.classList.add('on');
        }
        chart.period=p; saveConfig();
        tfs.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        drawChart(page,chart);
      };
      tfs.appendChild(b);
    });
  },0);
  return card;
}

function drawChart(page,chart) {
  const canvas=document.getElementById('cv-'+chart.id);
  const ld=document.getElementById('ld-'+chart.id);
  const er=document.getElementById('er-'+chart.id);
  const lg=document.getElementById('lg-'+chart.id);
  if (!canvas) return;
  if (er) er.textContent='';
  if (lg) lg.innerHTML='';

  let commonLabels=null;
  const datasets=[];
  let hasRight=false;

  chart.series.forEach(s=>{
    const src=SERIES[s.id];
    if (!src) return;
    const fn = s.fn||'raw';
    let pts;
    if (fn==='norm' || fn==='cumret') {
      // base ต้องเป็นจุดแรกของ "ช่วงที่เลือก" ไม่ใช่จุดแรกสุดของประวัติทั้งหมด
      // ต้อง cut ก่อนแล้วค่อย apply function
      pts = cutByPeriod(src.data, chart.period);
      pts = applyFn(pts, fn);
    } else {
      // ma20/ma50/yoy/mom ต้องการข้อมูลย้อนหลังก่อนช่วงที่เลือกด้วย
      // ต้อง apply function บน full series ก่อน แล้วค่อย cut
      pts = applyFn(src.data, fn);
      pts = cutByPeriod(pts, chart.period);
    }
    if (!pts.length) return;
    if (!commonLabels) commonLabels=pts.map(p=>p.x);
    const map=Object.fromEntries(pts.map(p=>[p.x,p.y]));
    const values=commonLabels.map(l=>map[l]??null);
    datasets.push({
      label:src.name,
      data:values,
      borderColor:s.color,
      borderWidth:1.8,
      pointRadius:0,
      pointHoverRadius:3,
      tension:0.3,
      fill:false,
      spanGaps:true,
      yAxisID:s.axis==='R'?'yR':'yL'
    });
    if (s.axis==='R') hasRight=true;
    if (lg) {
      const li=document.createElement('div');
      li.className='li';
      li.innerHTML=`<span class="ls" style="background:${s.color}"></span><span>${src.name}</span> <span style="color:var(--text3);margin-left:2px">${FN_LABEL[s.fn]||s.fn} ${s.axis}</span>`;
      lg.appendChild(li);
    }
  });

  if (ld) ld.style.display='none';
  canvas.style.display='block';
  if (!datasets.length||!commonLabels) { if(er) er.textContent='no data'; return; }
  if (charts[chart.id]) charts[chart.id].destroy();

  const gridColor='rgba(128,128,128,0.1)';
  const tickColor=getComputedStyle(document.documentElement).getPropertyValue('--text3').trim()||'#555';

  const scales={
    x:(function(){
      const period = chart.period;
      const labels = commonLabels;

      if (!labels.length) return { type:'category', labels };

      const first   = new Date(labels[0]);
      const last    = new Date(labels[labels.length - 1]);
      const lastMon = last.getUTCMonth() + 1;   // 1-12
      const lastYr  = last.getUTCFullYear();

      // --- หา index ของวันแรกที่มีข้อมูลในเดือน year/mon ---
      function firstDayIdx(year, mon) {
        const prefix = `${year}-${String(mon).padStart(2,'0')}-`;
        for (let i = 0; i < labels.length; i++) {
          if (labels[i].startsWith(prefix)) return i;
        }
        return -1;
      }

      // --- สร้าง tickMajor และ tickMinor sets ---
      const major = new Set();   // grid + label
      const minor = new Set();   // grid เท่านั้น (ไม่มี label)

      if (period === '3m' || period === '6m') {
        // วนทีละเดือนในช่วง data หา index วันแรกที่มีของแต่ละเดือน
        // ถ้าวันแรกที่มีข้อมูลของเดือนนั้น > วันที่ 4 (เช่นข้อมูลเริ่มกลางเดือน) ไม่ต้องแสดง label เดือนนั้น
        let y = first.getUTCFullYear(), m = first.getUTCMonth() + 1;
        const endY = last.getUTCFullYear(), endM = last.getUTCMonth() + 1;
        while (y < endY || (y === endY && m <= endM)) {
          const idx = firstDayIdx(y, m);
          if (idx >= 0 && new Date(labels[idx]).getUTCDate() <= 4) major.add(idx);
          m++; if (m > 12) { m = 1; y++; }
        }
        // 3m: เพิ่มครึ่งเดือน (วัน 15/16 วันแรกที่มีในครึ่งหลัง)
        if (period === '3m') {
          for (let i = 0; i < labels.length; i++) {
            const d   = new Date(labels[i]);
            const day = d.getUTCDate();
            if (day < 15) continue;
            const mon = d.getUTCMonth(), yr = d.getUTCFullYear();
            const alreadyHalf = [...major].some(j => {
              const d2 = new Date(labels[j]);
              return d2.getUTCFullYear() === yr && d2.getUTCMonth() === mon && d2.getUTCDate() >= 14;
            });
            if (!alreadyHalf) { major.add(i); break; }
          }
        }
      } else if (period === '1y') {
        // major: เดือนคี่หรือคู่ตาม lastMon, minor: ทุกเดือน
        const parity = lastMon % 2;  // 0=คู่, 1=คี่
        let y = first.getUTCFullYear(), m = first.getUTCMonth() + 1;
        while (y < lastYr || (y === lastYr && m <= lastMon)) {
          const idx = firstDayIdx(y, m);
          if (idx >= 0) {
            if (m % 2 === parity) major.add(idx);
            else                  minor.add(idx);
          }
          m++; if (m > 12) { m = 1; y++; }
        }

      } else if (period === '3y') {
        // major: Jan, Jul  |  minor: Apr, Oct (ทุก Q)
        let y = first.getUTCFullYear(), m = first.getUTCMonth() + 1;
        while (y < lastYr || (y === lastYr && m <= lastMon)) {
          const idx = firstDayIdx(y, m);
          if (idx >= 0) {
            if (m === 1 || m === 7)        major.add(idx);
            else if (m === 4 || m === 10)  minor.add(idx);
          }
          m++; if (m > 12) { m = 1; y++; }
        }

      } else {
        // 10y / max
        const rangeYears = (last - first) / (1000 * 60 * 60 * 24 * 365.25);
        const yearStep   = Math.max(1, Math.ceil(rangeYears / 6));
        const startYear  = first.getUTCFullYear();
        const endYear    = lastYr;

        // minor: ทุกปี Jan
        for (let y = startYear; y <= endYear; y++) {
          const idx = firstDayIdx(y, 1);
          if (idx >= 0) minor.add(idx);
        }
        // major: ทุก yearStep ปี จาก startYear
        for (let y = startYear; y <= endYear; y += yearStep) {
          const idx = firstDayIdx(y, 1);
          if (idx >= 0) { major.add(idx); minor.delete(idx); }
        }
      }

      const yearOnly = period === '10y' || period === 'max' ||
        ((last - first) / (1000*60*60*24*365.25) > 3);
      const showDay = period === '3m' || period === '6m';

      const fmt = (d) => {
        const dt = new Date(d);
        if (yearOnly) return String(dt.getUTCFullYear());
        const mon = dt.toLocaleDateString('en-GB', {month:'short', timeZone:'UTC'});
        if (showDay) return `${dt.getUTCDate()}-${mon}`;
        return mon + String(dt.getUTCFullYear()).slice(2);
      };

      const gridOpaque  = 'rgba(128,128,128,0.15)';
      const gridFaint   = 'rgba(128,128,128,0.06)';

      return {
        type:'category', labels,
        ticks:{
          color:tickColor, font:{family:'monospace',size:10}, maxRotation:0,
          autoSkip: false, maxTicksLimit: 9999,
          callback: (val, idx) => major.has(idx) ? fmt(labels[idx]) : ''
        },
        grid:{
          color: ctx => major.has(ctx.index) ? gridOpaque
                      : minor.has(ctx.index) ? gridFaint
                      : 'rgba(0,0,0,0)'
        },
        border:{color:gridOpaque}
      };
    })(),
    yL:{ position:'left', ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5}, grid:{color:'rgba(128,128,128,0.1)'}, border:{color:'rgba(128,128,128,0.1)'} }
  };
  if (hasRight) scales.yR={ position:'right', ticks:{color:tickColor,font:{family:'monospace',size:10},maxTicksLimit:5}, grid:{drawOnChartArea:false}, border:{color:gridColor} };

  charts[chart.id]=new Chart(canvas,{
    type:'line', data:{labels:commonLabels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      layout:{ padding:{ right:6, left:2 } },
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim()||'#1a1a1a',
          borderColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--border2').trim()||'#444',
          borderWidth:1,
          titleColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#aaa',
          bodyColor: ()=>getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e8e8e8',
          titleFont:{family:'monospace',size:11},bodyFont:{family:'monospace',size:12},
          displayColors:true,
          boxWidth:10,
          boxHeight:10,
          callbacks:{
            title: function(items) {
              const d = items[0]?.label;
              if (!d) return '';
              const dt = new Date(d + 'T00:00:00Z');
              return dt.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'});
            },
            label: function(item) {
              const v = item.raw;
              if (v === null || v === undefined) return null;
              const num = typeof v === 'number' ? v.toLocaleString('en-US',{maximumFractionDigits:2}) : v;
              return ' ' + item.dataset.label + ': ' + num;
            }
          }
        }
      },
      scales
    }
  });
}

window.openChartModal = function(pageId, chartId) {
  editingChart={pageId, chartId:chartId||null};
  document.getElementById('chart-modal-title').textContent=chartId?'Edit Chart':'Add Chart';
  let chart=null;
  if (chartId) {
    const page=config.pages.find(p=>p.id===pageId);
    chart=page.charts.find(c=>c.id===chartId);
  }
  document.getElementById('cm-title').value=chart?.title||'';
  document.getElementById('cm-period').value=chart?.period||'1y';
  const wrap=document.getElementById('cm-series');
  wrap.innerHTML='';
  const sList=chart?.series||[{id:Object.keys(SERIES)[0]||'SPX',axis:'L',fn:'raw',color:COLORS[0]}];
  sList.forEach((s,i)=>wrap.appendChild(makeSeriesRow(s,i)));
  updateAddBtn();
  document.getElementById('chart-modal').classList.add('show');
};

function makeSeriesRow(s,idx) {
  const row=document.createElement('div');
  row.className='series-row';

  // series
  const sel=document.createElement('select');
  const grouped=new Set();
  Object.entries(SERIES_GROUPS).forEach(([grp,ids])=>{
    const og=document.createElement('optgroup');
    og.label=grp;
    ids.forEach(id=>{
      if (!SERIES[id]) return;
      grouped.add(id);
      const opt=document.createElement('option');
      opt.value=id; opt.textContent=SERIES[id].name;
      if (id===s.id) opt.selected=true;
      og.appendChild(opt);
    });
    if (og.children.length) sel.appendChild(og);
  });
  // ungrouped
  const other=document.createElement('optgroup'); other.label='Other';
  Object.keys(SERIES).sort().forEach(id=>{
    if (grouped.has(id)) return;
    if (id.startsWith('EPPO_')) return; // ซ่อน field breakdown อื่นของ EPPO ที่ไม่ใช่ retail/wholesale/oil fund
    const opt=document.createElement('option');
    opt.value=id; opt.textContent=SERIES[id].name;
    if (id===s.id) opt.selected=true;
    other.appendChild(opt);
  });
  if (other.children.length) sel.appendChild(other);

  // axis
  const axis=document.createElement('select');
  ['L','R'].forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent='Axis '+a; if(a===s.axis)o.selected=true; axis.appendChild(o); });

  // fn per series
  const fn=document.createElement('select');
  FN_OPTS.forEach(f=>{ const o=document.createElement('option'); o.value=f; o.textContent=FN_LABEL[f]; if(f===(s.fn||'raw'))o.selected=true; fn.appendChild(o); });

  // color
  const colorSel=document.createElement('select');
  ['blue','red','amber','green','purple','gray','orange','teal'].forEach((n,i)=>{
    const o=document.createElement('option'); o.value=COLORS[i]; o.textContent=n;
    if(COLORS[i]===s.color)o.selected=true; colorSel.appendChild(o);
  });

  const rm=document.createElement('button');
  rm.className='rm-btn'; rm.textContent='✕';
  rm.onclick=()=>{ row.remove(); updateAddBtn(); };

  row.appendChild(sel); row.appendChild(axis); row.appendChild(fn); row.appendChild(colorSel); row.appendChild(rm);
  return row;
}

window.addSeriesRow = function() {
  const wrap=document.getElementById('cm-series');
  if (wrap.children.length>=8) return;
  const n=wrap.children.length;
  wrap.appendChild(makeSeriesRow({id:Object.keys(SERIES)[0]||'SPX',axis:'L',fn:'raw',color:COLORS[n%COLORS.length]},n));
  updateAddBtn();
};

function updateAddBtn() {
  const n=document.getElementById('cm-series').children.length;
  document.getElementById('cm-add-btn').style.display=n>=8?'none':'block';
}

window.saveChart = function() {
  const title=document.getElementById('cm-title').value.trim()||'Chart';
  const period=document.getElementById('cm-period').value;
  const series=[...document.getElementById('cm-series').children].map(row=>{
    const sels=row.querySelectorAll('select');
    return {id:sels[0].value, axis:sels[1].value, fn:sels[2].value, color:sels[3].value};
  });
  if (!series.length) return;
  const page=config.pages.find(p=>p.id===editingChart.pageId);
  if (editingChart.chartId) {
    const chart=page.charts.find(c=>c.id===editingChart.chartId);
    Object.assign(chart,{title,period,series});
  } else {
    page.charts.push({id:uid(),title,period,series});
  }
  saveConfig(); closeChartModal(); render();
};

window.closeChartModal=()=>document.getElementById('chart-modal').classList.remove('show');

window.deleteChart=function(pageId,chartId){
  if (!confirm('ลบ chart นี้?')) return;
  const page=config.pages.find(p=>p.id===pageId);
  page.charts=page.charts.filter(c=>c.id!==chartId);
  saveConfig(); render();
};

let editingPageId=null;

window.openPageModal=function(){
  editingPageId=null;
  document.getElementById('page-modal-title').textContent='Add Page';
  document.getElementById('pm-name').value='';
  document.getElementById('pm-cols').value='2';
  document.getElementById('page-modal').classList.add('show');
};

window.editPage=function(pageId){
  editingPageId=pageId;
  const page=config.pages.find(p=>p.id===pageId);
  document.getElementById('page-modal-title').textContent='Edit Page';
  document.getElementById('pm-name').value=page.name;
  document.getElementById('pm-cols').value=String(page.cols||0);
  document.getElementById('page-modal').classList.add('show');
};

window.savePage=function(){
  const name=document.getElementById('pm-name').value.trim()||'Page';
  const cols=parseInt(document.getElementById('pm-cols').value);
  if (editingPageId) {
    const page=config.pages.find(p=>p.id===editingPageId);
    page.name=name; page.cols=cols;
  } else {
    const np={id:uid(),name,cols,charts:[]};
    config.pages.push(np);
    activePageId=np.id;
  }
  saveConfig(); closePageModal(); render();
};

window.closePageModal=()=>document.getElementById('page-modal').classList.remove('show');

window.deletePage=function(pageId){
  if (!confirm('ลบ page ทั้งหมด?')) return;
  config.pages=config.pages.filter(p=>p.id!==pageId);
  if (activePageId===pageId) activePageId=config.pages[0]?.id||null;
  saveConfig(); render();
};
