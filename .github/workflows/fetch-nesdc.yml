name: Fetch NESDC Quarterly GDP

on:
  # TEMP-DISABLED-2026-08: ปิด schedule ชั่วคราวเพราะ GitHub Actions ติด quota — รัน local แทน, กลับมาเปิดตอนต้นเดือนหน้า
  # schedule:
  #   - cron: '0 2 15 2,5,8,11 *'   # 09:00 ICT วันที่ 15 ของเดือนหลัง GDP quarter ปิด (ก.พ./พ.ค./ส.ค./พ.ย.) — NESDC อัพเดทไม่บ่อย ไม่ต้องเช็คทุกวัน
  workflow_dispatch:

jobs:
  fetch-nesdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install packages and run
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("httr2","jsonlite","jose","dplyr","purrr","tibble","stringr","readxl")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss)) install.packages(miss, lib = lib, dependencies = TRUE)
          .libPaths(c(lib, .libPaths()))
          source("fetch_nesdc.R")
          '
