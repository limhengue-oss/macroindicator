name: Daily News Pipeline

on:
  # TEMP-DISABLED-2026-08: ปิด schedule ชั่วคราวเพราะ GitHub Actions ติด quota — รัน local แทน, กลับมาเปิดตอนต้นเดือนหน้า
  # schedule:
  #   - cron: '0 0 * * *'   # 07:00 ICT (morning)
  #   - cron: '0 6 * * *'   # 13:00 ICT (afternoon)
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          token_format: access_token

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install R packages
        # options(timeout=...) กัน download มะรื่ออก (CRAN/RSPM mirror ค้าง) จาก
        # การแขวนไม่มีกำหนด — ค่า default ของ R (60s) มักสั้นไปสำหรับ package ใหญ่
        # แต่ก็ต้องมี upper bound ชัดเจน ไม่ใช่ไม่มีเลย
        run: |
          options(timeout = 120)
          install.packages(c("httr2", "xml2", "jsonlite", "dplyr"))
        shell: Rscript {0}

      - name: Run news pipeline
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_URL:    ${{ secrets.FIREBASE_URL }}
          FIREBASE_TOKEN:  ${{ steps.auth.outputs.access_token }}
          FT_COOKIE:       ${{ secrets.FT_COOKIE }}
        run: Rscript fetch_news.R
        working-directory: ./news-pipeline
