name: Splice & cleanup IMF duplicate series (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (หา/เทียบคู่ซ้ำเฉย ๆ ไม่เขียน Firestore)'
        type: boolean
        default: true
      delete_losers:
        description: 'ลบตัวแพ้จริง (หลัง splice แล้วเท่านั้น — ทำงานเฉพาะตอน dry_run=false)'
        type: boolean
        default: false
      datasets:
        description: 'จำกัดเฉพาะ dataset (comma-separated เช่น "CPI_WCA") — เว้นว่าง = รันครบทุกตัวใน allowlist'
        type: string
        default: ''

jobs:
  splice-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install packages and run
        env:
          GCP_SA_KEY:      ${{ inputs.dry_run && '' || secrets.GCP_SA_KEY }}
          DELETE_LOSERS:   ${{ inputs.delete_losers && 'true' || 'false' }}
          SPLICE_DATASETS: ${{ inputs.datasets }}
        run: |
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("httr2","jsonlite","jose","dplyr","purrr","readr","tibble","stringr","xml2")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss)) install.packages(miss, lib = lib, dependencies = TRUE)
          .libPaths(c(lib, .libPaths()))
          source("scripts/oneoff/splice_and_cleanup_imf_duplicates.R")
          '
