name: Fetch IMF (21 dataset, raw index/level, all countries)

on:
  schedule:
    # 01:00 ICT ทุกวันพุธ = 18:00 UTC วันอังคาร (ICT = UTC+7) — IMF ไม่มี
    # release schedule ตายตัวให้ยึด (เช็คแล้ว 2026-09-04: dataflow metadata
    # ไม่มี field บอกความถี่ update เลย) ตั้งตามความถี่ของข้อมูลเอง (CPI/
    # ส่วนใหญ่รายเดือน) รายสัปดาห์พอ ไม่ต้องถี่กว่านี้ — schedule trigger ไม่มี
    # ตัว "inputs" context เลย (มีแค่ workflow_dispatch/workflow_call) ทำให้
    # inputs.dry_run/inputs.datasets ด้านล่างเป็นค่าว่างเสมอตอน schedule รัน
    # → รันจริง (ไม่ dry run) ครบทุก 21 dataset โดยอัตโนมัติ
    - cron: '0 18 * * 2'
  workflow_dispatch:   # รันมือได้ตลอด (ทดสอบ/จำกัด dataset/dry run) นอกเหนือจาก schedule รายสัปดาห์
    inputs:
      dry_run:
        description: 'Dry run (ดึงข้อมูลมาดูเฉย ๆ ไม่ push Firestore)'
        type: boolean
        default: true
      datasets:
        description: 'จำกัดเฉพาะ dataset (comma-separated เช่น "MFS_CBS,QNEA") — เว้นว่าง = รันครบทุกตัว'
        type: string
        default: ''

jobs:
  fetch-imf:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install packages and run
        env:
          GCP_SA_KEY:  ${{ inputs.dry_run && '' || secrets.GCP_SA_KEY }}
          IMF_FETCH_DATASETS: ${{ inputs.datasets }}
        run: |
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("httr2","jsonlite","jose","dplyr","purrr","readr","tibble","stringr","xml2")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss)) install.packages(miss, lib = lib, dependencies = TRUE)
          .libPaths(c(lib, .libPaths()))
          source("fetch_imf_multi.R")
          '
