name: Update Macro Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system deps (pdftools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-cpp-dev

      - name: Install and run
        id: run
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY:   ${{ secrets.GCP_SA_KEY }}
        run: |
          set -o pipefail
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("curl","httr","httr2","jsonlite","jose",
                    "quantmod","TTR","timetk","xts","zoo",
                    "tidyquant","fredr",
                    "dplyr","tidyr","purrr","tibble","stringr","lubridate","xml2","readxl","rvest","pdftools")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss) > 0) {
            message("Installing: ", paste(miss, collapse=", "))
            install.packages(miss, lib = lib, dependencies = TRUE)
          }
          message("Packages OK")
          .libPaths(c(lib, .libPaths()))
          source("fetch_and_push.R")
          source("fetch_eppo.R")
          ' 2>&1 | tee run.log

      - name: Summarize EPPO skips
        if: always()
        id: summary
        run: |
          SKIPPED=$(grep -E "skip ทั้งไฟล์|missing products|HEADER_MISMATCH" run.log || true)
          CHANGES=$(grep -E "^PRICE_CHANGE:" run.log || true)
          FRESH=$(grep -E "^STALE_CHECK:" run.log || true)
          STALE=$(grep -E "^STALE_ALERT:" run.log || true)
          DAILY_DUE=$(grep -E "^DAILY_REPORT_DUE: true" run.log || true)
          {
            echo "skipped<<EOF"
            if [ -n "$SKIPPED" ]; then echo "$SKIPPED"; else echo "(none)"; fi
            echo "EOF"
            echo "changes<<EOF"
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "(none)"; fi
            echo "EOF"
            echo "freshness<<EOF"
            if [ -n "$FRESH" ]; then echo "$FRESH"; else echo "(ไม่พบ log — อาจ error ก่อนถึงขั้นตอนนี้)"; fi
            echo "EOF"
            echo "stale<<EOF"
            if [ -n "$STALE" ]; then echo "$STALE"; else echo "(none — ข้อมูลยังไม่ล่าช้าเกินเกณฑ์)"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$SKIPPED" ]; then echo "has_skip=true" >> "$GITHUB_OUTPUT"; else echo "has_skip=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CHANGES" ]; then echo "has_change=true" >> "$GITHUB_OUTPUT"; else echo "has_change=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$DAILY_DUE" ]; then echo "daily_due=true" >> "$GITHUB_OUTPUT"; else echo "daily_due=false" >> "$GITHUB_OUTPUT"; fi

      - name: Send notification email
        if: always() && (steps.run.outcome != 'success' || steps.summary.outputs.has_skip == 'true' || steps.summary.outputs.has_change == 'true' || steps.summary.outputs.daily_due == 'true')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: limhengue@gmail.com, wasinr@bot.or.th
          subject: "[macroindicator] Update Data — ${{ steps.run.outcome == 'success' && 'SUCCESS' || 'FAILED' }}"
          body: |
            fetch_and_push.R / fetch_eppo.R run: ${{ steps.run.outcome }}

            รายงานความสด (OFFO/EPPO oil price) — รอบแรกของวันนี้:
            ${{ steps.summary.outputs.freshness }}
            ${{ steps.summary.outputs.stale }}

            Price changes (DIESEL RETAIL / GASOHOL 95 RETAIL):
            ${{ steps.summary.outputs.changes }}

            EPPO/OFFO skipped files (missing products, or HEADER_MISMATCH = โครงสร้างคอลัมน์ไฟล์เปลี่ยน ต้องแก้ fetch_eppo.R):
            ${{ steps.summary.outputs.skipped }}

            Dashboard: https://limhengue-oss.github.io/macroindicator/
            Full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail job if run failed
        if: steps.run.outcome != 'success'
        run: exit 1
