name: Update Macro Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        # setup-r เรียก apt-get ของตัวเองข้างในเพื่อติดตั้ง R บน mirror เดียวกับ
        # step ถัดไป (azure.archive.ubuntu.com) — เจอเคสจริง 2026-08-19 ที่ค้างตรงนี้
        # แทน (คนละรอบกับที่เคยค้างที่ "Install system deps") กินเวลาเต็ม job
        # timeout 30 นาทีเหมือนกัน จึงต้องใส่ step-level timeout กันไว้ด้วย
        id: setupr
        continue-on-error: true
        timeout-minutes: 5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system deps (pdftools)
        if: steps.setupr.outcome == 'success'
        # apt mirror (azure.archive.ubuntu.com) เคยค้างไม่ตอบสนองแล้ว job แขวนหลายชม.
        # เพราะ apt-get ไม่มี timeout ของตัวเอง — ใส่ Acquire options ให้ fail เร็วแทน
        # แขวนเงียบๆ (retry เอง 3 ครั้ง, timeout ต่อ connection 15s) แต่พบว่า Acquire
        # timeout ไม่ครอบคลุมกรณี transfer ค้างกลางทาง (connect ผ่านแล้วแต่ data
        # หยุดไหลกลางคัน) — เจอเคสจริง 2026-08-19 ที่ apt-get update ค้าง ~29 นาที
        # หลัง "Get" เริ่ม download แล้วไม่จบ จนชน job-level timeout ทั้ง job (30 นาที)
        # โดยที่ Rscript ยังไม่ทันเริ่มรันเลย — ห่อด้วย `timeout` ของ shell (บังคับ
        # kill จริงไม่สนใจ apt's internal timeout) + step-level timeout-minutes กันไม่
        # ให้ step เดียวกินเวลาทั้ง job budget
        id: sysdeps
        continue-on-error: true
        timeout-minutes: 5
        run: |
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          timeout 180 sudo apt-get install -y libpoppler-cpp-dev

      - name: Install and run
        id: run
        # ถ้า apt (sysdeps) fail/timeout ไป pdftools จะ build/load ไม่ได้อยู่ดี — ข้าม
        # ไปเลยแทนที่จะปล่อยให้ Rscript พังคาไว้กลางทาง จะได้ error message ที่ชัดเจน
        # กว่าจากขั้นตอน summarize/email แทน
        if: steps.sysdeps.outcome == 'success'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY:   ${{ secrets.GCP_SA_KEY }}
        run: |
          set -o pipefail
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("curl","httr","httr2","jsonlite","jose",
                    "quantmod","TTR","timetk","xts","zoo",
                    "tidyquant","fredr",
                    "dplyr","tidyr","purrr","tibble","stringr","lubridate","xml2","readxl","rvest","pdftools")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss) > 0) {
            message("Installing: ", paste(miss, collapse=", "))
            install.packages(miss, lib = lib, dependencies = TRUE)
          }
          message("Packages OK")
          .libPaths(c(lib, .libPaths()))
          source("fetch_and_push.R")
          source("fetch_eppo.R")
          ' 2>&1 | tee run.log

      - name: Summarize EPPO skips
        if: always()
        id: summary
        run: |
          SKIPPED=$(grep -E "skip ทั้งไฟล์|missing products|HEADER_MISMATCH" run.log 2>/dev/null || true)
          CHANGES=$(grep -E "^PRICE_CHANGE:" run.log 2>/dev/null || true)
          FRESH=$(grep -E "^STALE_CHECK:" run.log 2>/dev/null || true)
          STALE=$(grep -E "^STALE_ALERT:" run.log 2>/dev/null || true)
          DAILY_DUE=$(grep -E "^DAILY_REPORT_DUE: true" run.log 2>/dev/null || true)
          {
            echo "skipped<<EOF"
            if [ -n "$SKIPPED" ]; then echo "$SKIPPED"; else echo "(none)"; fi
            echo "EOF"
            echo "changes<<EOF"
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "(none)"; fi
            echo "EOF"
            echo "freshness<<EOF"
            if [ -n "$FRESH" ]; then echo "$FRESH"; else echo "(ไม่พบ log — fetch script ยังไม่ทันรันถึงขั้นตอนนี้)"; fi
            echo "EOF"
            echo "stale<<EOF"
            if [ -n "$STALE" ]; then echo "$STALE"; else echo "(none — ข้อมูลยังไม่ล่าช้าเกินเกณฑ์)"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$SKIPPED" ]; then echo "has_skip=true" >> "$GITHUB_OUTPUT"; else echo "has_skip=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CHANGES" ]; then echo "has_change=true" >> "$GITHUB_OUTPUT"; else echo "has_change=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$DAILY_DUE" ]; then echo "daily_due=true" >> "$GITHUB_OUTPUT"; else echo "daily_due=false" >> "$GITHUB_OUTPUT"; fi

      - name: Determine overall status
        if: always()
        id: status
        run: |
          if [ "${{ steps.setupr.outcome }}" != "success" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "label=❌ FAILED (Setup R ไม่สำเร็จ/ค้าง — มักเป็น apt mirror ช้า ลอง rerun)" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.sysdeps.outcome }}" != "success" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "label=❌ FAILED (apt-get ติดตั้ง system deps ไม่สำเร็จ/ค้าง — ดู step \"Install system deps\")" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "label=❌ FAILED (fetch script error — ดู run.log)" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "label=✅ SUCCESS" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: always() && (steps.status.outputs.ok != 'true' || steps.summary.outputs.has_skip == 'true' || steps.summary.outputs.has_change == 'true' || steps.summary.outputs.daily_due == 'true')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: limhengue@gmail.com, wasinr@bot.or.th
          subject: "[macroindicator] Update Data — ${{ steps.status.outputs.ok == 'true' && 'SUCCESS' || 'FAILED' }}"
          convert_markdown: true
          body: |
            # 🛢️ Macroindicator — ${{ steps.status.outputs.label }}

            | ขั้นตอน | สถานะ |
            |---|---|
            | Setup R | ${{ steps.setupr.outcome }} |
            | Install system deps (apt) | ${{ steps.sysdeps.outcome }} |
            | fetch_and_push.R / fetch_eppo.R | ${{ steps.run.outcome }} |

            ## 📊 ความสดของข้อมูล (OFFO/EPPO oil price) — รอบแรกของวันนี้
            ```
            ${{ steps.summary.outputs.freshness }}
            ${{ steps.summary.outputs.stale }}
            ```

            ## 💰 Price changes (DIESEL RETAIL / GASOHOL 95 RETAIL)
            ```
            ${{ steps.summary.outputs.changes }}
            ```

            ## ⚠️ EPPO/OFFO skipped files
            _(missing products หรือ HEADER_MISMATCH = โครงสร้างคอลัมน์ไฟล์เปลี่ยน ต้องแก้ `fetch_eppo.R`)_
            ```
            ${{ steps.summary.outputs.skipped }}
            ```

            ---

            📈 [Dashboard](https://limhengue-oss.github.io/macroindicator/) · 📋 [Full run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Fail job if run failed
        if: steps.status.outputs.ok != 'true'
        run: exit 1
