name: Update Macro Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install and run
        id: run
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GCP_SA_KEY:   ${{ secrets.GCP_SA_KEY }}
        run: |
          set -o pipefail
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("curl","httr","httr2","jsonlite","jose",
                    "quantmod","TTR","timetk","xts","zoo",
                    "tidyquant","fredr",
                    "dplyr","tidyr","purrr","tibble","stringr","lubridate","xml2","readxl","rvest")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss) > 0) {
            message("Installing: ", paste(miss, collapse=", "))
            install.packages(miss, lib = lib, dependencies = TRUE)
          }
          message("Packages OK")
          .libPaths(c(lib, .libPaths()))
          source("fetch_and_push.R")
          source("fetch_eppo.R")
          ' 2>&1 | tee run.log

      - name: Summarize EPPO skips
        if: always()
        id: summary
        run: |
          SKIPPED=$(grep -E "skip ทั้งไฟล์|missing products" run.log || true)
          {
            echo "skipped<<EOF"
            if [ -n "$SKIPPED" ]; then echo "$SKIPPED"; else echo "(none)"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: limhengue@gmail.com, wasinr@bot.or.th
          subject: "[macroindicator] Update Data — ${{ steps.run.outcome == 'success' && 'SUCCESS' || 'FAILED' }}"
          body: |
            fetch_and_push.R / fetch_eppo.R run: ${{ steps.run.outcome }}

            EPPO skipped files (missing products):
            ${{ steps.summary.outputs.skipped }}

            Full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail job if run failed
        if: steps.run.outcome != 'success'
        run: exit 1
