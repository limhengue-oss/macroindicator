name: Fetch Thai Gold Price

# หมายเหตุ 2026-08-16: ปิด cron schedule ถาวร (ไม่ใช่แค่ปิดชั่วคราว) — เว็บ
# goldtraders.or.th อยู่หลัง Cloudflare ซึ่ง 403 บล็อกทุก request จาก IP ของ
# GitHub-hosted runner (เช็คแล้วด้วย diagnostic script, เป็น Cloudflare JS
# challenge page ไม่ใช่ปัญหา header/User-Agent — เปลี่ยน header ไม่ช่วย ต้องใช้
# browser จริงหรือ IP ที่ไม่ใช่ datacenter เท่านั้นถึงจะผ่าน) ผู้ใช้เลือกรัน
# fetch_goldth.R เองเป็นระยะจาก local machine แทน (ดู comment ในไฟล์นั้น) —
# เก็บ workflow_dispatch ไว้เผื่ออนาคตมี self-hosted runner หรือ IP ไม่โดนบล็อกแล้ว
on:
  workflow_dispatch:

jobs:
  fetch-goldth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install packages and run
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          Rscript -e '
          lib <- "/home/runner/R-pkgs"
          dir.create(lib, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          pkgs <- c("httr2","jsonlite","jose","dplyr","purrr","tibble","lubridate")
          miss <- pkgs[!pkgs %in% installed.packages(lib.loc = lib)[,"Package"]]
          if (length(miss)) install.packages(miss, lib = lib, dependencies = TRUE)
          .libPaths(c(lib, .libPaths()))
          source("fetch_goldth.R")
          '
